        #table3 {

        #table3 th,

            height: 3rem;
            border: .1rem solid black;

        #table3 th {
            position: sticky;
            top: 0;
            background-color: antiquewhite;
        }

        #table3 #sn,
        #table3 .sn {
            display: none;
        }

        #table3 input {
            border: none;
            outline: none;
        }

        #sa1 {
            height: 100%;
            width: 100%;
            border: none;
            outline: none;
        }

        #del,
        #upd {
            font-size: 2rem;

        }

        #del {
            color: red;
            font-weight: bold;
        }

        #upd {
            color: black;
            font-weight: bold;
        }

        #del:hover,
        #upd:hover {
            cursor: pointer;
            scale: 1.5;
            transition: .3s;

        }
        #box1 {
            width: 15rem;

        }


        @media (max-width:998px) {
            html {

            }
        }

        @media (max-width:768px) {

            html {

            }

            #table1 td {

            }

            #table1 #td2 {
                display: none;
            }

            #table3 th {
                display: none;
            }

            #table1 td,
            #table2 td,
            #table3 td {
                display: block;
            }

            #table2 td {
                width: 100%;
                /* border: 2px solid red; */
            }

            #lt {
                margin-left: 9%;
            }

            #d4 {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-around;
            }

            #b5 {
                margin-left: 0;
            }

            #table2 #sr {
                text-align: center;
            }

            .fa-search {
                margin: 1rem 2rem;
            }

            #d5 {
                height: auto;
            }

            #to {
                width: 59%;

            }


            #table3 .sn {
                display: block;
                background-color: antiquewhite;
            }

            #table3 td {
                text-align: right;
                
            }

            #table3 td::before {
                content: attr(data-label);
                float: left;
                font-weight: bold;
                color: black;
            }

            #sa1 {
                width: 50%;
            }
        }
    </style>
</head>

<body>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="//cdn.rawgit.com/rainabba/jquery-table2excel/1.1.0/dist/jquery.table2excel.min.js"></script>
    <script>
        // ====================== Animation ===============================
        $('#b2').click(function () {
            $('#togx').css({ 'margin-left': '10rem', 'border-radius': '0 1rem 1rem 0' });
            $('#body').css('margin-left', '-100%');
            $('#lf,#lt,.fa-search').show();
        })
        $('#b1').click(function () {
            $('#togx').css({ 'margin-left': '0rem', 'border-radius': '1rem 0 0 1rem' });
            $('#body').css('margin-left', '0%');
            $('#lf,#lt,.fa-search').hide();
            $('#d3').html('');
        })
        
        // --------------------------------------------------------------------

        function flchk(id) {
            var k = $(id).val().trim();
            if (k == '') {

                $(id).removeAttr('type')
                $(id).val('Field Is Mandatory!')
                $(id).css({ "border": "solid 1px red", "color": "red" });
                flag = false

            }
        }
        function fgchk(id) {
            var k = $(id).val();
            if (k.trim() == 'Field Is Mandatory!') {
                $(id).val('')
                $(id).css({ "border": "solid 1px black", "color": "black" });
                flag = false;
            }
        }
        // --------------------------------------------------------
        $('#t0').on('keypress', function (e) {
            if ((e.which == 32) && e.target.selectionStart == 0)
                return false;
            else if (!(e.which >= 48 && e.which <= 57 || e.which == 46)) {
                $('#t9').html('Only Digit allowed')
                return false;
            }
        });

        $('#t2').on('keypress', function (e) {
            if ((e.which == 32) && e.target.selectionStart == 0)
                return false;
            else if (e.which == 32 && $(this).val().slice(-1) == ' ') {
                e.preventDefault();
            }
            else if (!(e.which >= 65 && e.which <= 90 || e.which >= 97 && e.which <= 122 || e.which == 32)) {
                $('#ll').html('Only Alphabate allowed')
                return false;
            }
        });
        $('#t7').on('keypress', function (e) {
            if ((e.which == 32) && e.target.selectionStart == 0)
                return false;
            else if (e.which == 32 && $(this).val().slice(-1) == ' ') {
                e.preventDefault();
            }
            else if (!(e.which >= 65 && e.which <= 90 || e.which >= 97 && e.which <= 122 || e.which == 32)) {
                $('#ll').html('Only Alphabate allowed')
                return false;
            }
        });
        $('#t9').on('keypress', function (e) {
            if ((e.which == 32) && e.target.selectionStart == 0)
                return false;
            else if (e.which == 32 && $(this).val().slice(-1) == ' ') {
                e.preventDefault();
            }
            else if (!(e.which >= 65 && e.which <= 90 || e.which >= 97 && e.which <= 122 || e.which == 32)) {
                $('#ll').html('Only Alphabate allowed')
                return false;
            }
        });

        function checksdate() {
            var b = new Date().toLocaleDateString().split('/');
            $('#t3').attr('min', b[2] + "-" + b[1] + "-" + b[0]);
        }
        $(document).ready(function () {
            var dt=new Date()
            dd=dt.getDate()
           yy=dt.getFullYear()
           mm=dt.getMonth()+1
           if (dd < 10)
           dd='0'+dd
           if (mm<10)
           mm='0'+mm
           ss=yy+'-'+mm+'-'+dd
           $('#t8').val(ss)
        $('#t8').attr('readonly','readonly');

            checksdate();
        })
      
    //  ===================================================
        $(document).ready(function () {
            $("#b6").click(function () {
                $('.s1').val()
                $('.s2').val('')
                $('#d5').html('')


            });
        });
        function clr() {
            location.reload()

        }

        // ===============================================================sumit
        $('#b3').click(function () {
            flag = true;
            flchk('#t5')
            flchk('#t2')
            flchk('#t0')
            flchk('#t9')
            flchk('#t7')
            flchk('#t8')
            flchk('#t3')
            // console('#d3')

            if (flag) {
                con = confirm("Are you really want to insert record");
                if (con)
                    $.ajax({
                        url: 'book.py',
                        method: 'post',
                        data: {
                            t: 'ent',
                            t1: $('#t5').val(),
                            t2: $('#t2').val(),
                            t3: $('#t0').val(),
                            t4: $('#t9').val(),
                            t5: $('#t7').val(),
                            t6: $('#t8').val(),
                            t7: $('#t3').val()
                        },
                        success: function (data) {
                            alert(data)
                            location.reload()
                        }
                    })
                else {
                    alert('fill all filed')
                }
            }
        });
        $('#b5').click(function () {
            var a = document.querySelector('#s1').value;
            var b = $('#to').val()
            var c= $('#s3').val()
            $.ajax({
                url: 'book.py',
                method: 'post',
                data: {
                    t: 'search',
                    t1: a,
                    t2: b,
                    t3: c
                },
                success: function (data) {
                        $('#d5').html(data)
                
                }
                
            })
           
        })
        
        $(document).on('focus', '#e', function () {
            a = $(this).text().trim();
            $(this).text(a)
        })
        $(document).on('focusout', '#e', function () {
            a = $(this).text().trim();
            $(this).text(a + '  ')
        })
        $(document).on('focusout','#t5',function(){
           var a= $(this).val()
           if( a==0){
           $('#t2').val('registration fild empty')}
           else {
            $('#t2').val()
           }
        //    alert(a)
        
        $.ajax({
            url:'book.py',
            method:'post',
            data: {
                t:'match',
                s1: a
            },
            success: function(data)
          {  if (data == 0) {
            $('#t2').val('')
           alert("Data not found")
         }
          else {
          $('#t2').val(data)
          } 
        }
        })
        
         
        
        })
        $(document).on('click', '#upd', function () {
            // alert('hjgbk')
            var a = $(this).closest('tr').children('td').text().split('  ');
            // alert(a)
            d5 = a[0]
            // alert(d5)
            if (d5) {
                var flag = confirm("Are you sure want to update")
                // alert(flag)
                if (flag)
                    $.ajax({
                        url: 'book.py',
                        method: 'post',
                        data: {
                            t: 'update',
                            s1: d5,
                            s2: a[1],
                            s3: a[2],
                            s4: a[3],
                            s5: a[4],
                            s6:$(this).parent('td').prev('td').prev('td').prev('td').prev('td').children('input').val(),
                            s7:$(this).parent('td').prev('td').prev('td').prev('td').children('input').val(),
                            s8: a[7],
                            s9: a[8]

                        },
                        success: function (data) {
                            alert(data)
                        }
                    })
            }
            else
                alert('Select any row!')
        })
        $(document).on('click', '#del', function () {
            var a = $(this).closest('tr').children("td").text().split('  ');
            d5 = a[0]
            alert(d5)
            if (d5) {
                var flag = confirm("Are you sure want to delete")
                if (flag)
                    $.ajax({
                        url: 'book.py',
                        method: 'post',
                        data: {
                            t: 'delete',
                            s1: d5
                        },
                        success: function (data) {
                            alert(data);
                            $(this).closest('tr').remove();
                        }
                    })
            }
            else
                alert('Select any row!')

        })
        $('#s1').on('change', function () {
            a = $(this).val()
            if (a != 'reg_no')
                $('#to').attr('type', 'date')
            else
                
                $('#to').removeAttr('type')
        })
    </script>
</body>
