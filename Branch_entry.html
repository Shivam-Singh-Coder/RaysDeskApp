            // ---------------current date validation--------------------------
            function Tdate() {
                var x = new Date();
                dd = x.getDate();
                yy = x.getFullYear();
                mm = x.getMonth() + 1;
                if (dd < 10) dd = "0" + dd;
                if (mm < 10) mm = "0" + mm;
                y = yy + "-" + mm + "-" + dd; //for date format
                $(".xx").val(y);
                $(".xx").attr('max', y);
            }

            $(document).ready(function () {
                Tdate();
            });

            $('input').focusin(function () {
                if ($(this).val() == "Field Is Mandatory!") {

            $('.xx').on('keypress', function (e) {
                if ((e.which == 32) && e.target.selectionStart == 0)
                    return false;
                else if ((e.which >= 48 && e.which <= 57)) {
                    return false;
                }
            });
// ===================================================================================================
            $('#t9').on('keypress', function (e) {
                if ((e.which == 32) && e.target.selectionStart == 0)
                    return false;
                else if (!(e.which >= 48 && e.which <= 57 || e.which == 46)) {
                    $('#nnn').html('<br>Only Digit allowed')
                    return false;
                }
                else if (e.which == 32 && $(this).val().slice(-1) == ' ') {
                    e.preventDefault();
                }
                else
                    $('#nnn').html('')
            });
            $('#t6').on('keypress', function (e) {
                if ((e.which == 32) && e.target.selectionStart == 0)
                    return false;
                else if (!(e.which >= 65 && e.which <= 90 || e.which >= 97 && e.which <= 122 || e.which == 32 || e.which==46)) {
                    $('#ppp').html('<br>Only Alphabet allowed')
                    return false;
                }
                else if ((e.which == 32 && $(this).val().slice(-1) == ' ') ||(e.which == 46 && $(this).val().slice(-1) == '.')) {
                    e.preventDefault();
                }

                    $('#ppp').html('')
            });
            $('#t5').on('keypress', function (e) {

                }
