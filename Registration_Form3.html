<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Registration Form</title>
    <link rel="icon" href="repllogo.png">
    <style>
        html {
            font-size: 10px;
        }

        body {
            margin: 0;
            overflow-x: hidden;
        }

        #main {
            width: 100%;
            height: auto;
            overflow-x: hidden;
        }

        #d1 {
            height: 7rem;
            background-color: rgb(77, 169, 244);
        }

        #hm {
            height: 7rem;
            width: auto;
            display: flex;
            align-items: center;
            float: left;
        }

        #d1 a {
            text-decoration: none;
            margin: 3rem;
        }

        #tog {
            margin: 1.5rem 3rem;
            height: 4rem;
            width: 20rem;
            display: flex;
            float: right;
        }

        #togx {
            position: absolute;
            height: 4rem;
            width: 10rem;
            background-color: white;
            transition: .3s;
            /* margin-left: 10rem; */
            border-radius: 1rem 0 0 1rem;
            /* box-shadow: 2px 2px 10px rgb(249, 65, 237); */
        }

        #tog p {
            margin: 0;
            position: relative;
            height: 100%;
            width: 50%;
            cursor: pointer;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            font-size: 2rem;
        }

        #b1 {
            border-radius: 1rem 0 0 1rem;
        }

        #b2 {
            border-radius: 0 1rem 1rem 0;
        }

        #body {
            width: 200%;
            transition: .5s;
        }

        #ent,
        #ser {
            height: auto;
            width: 50%;
            float: left;
        }
        #d2 {
            background-color: rgb(179, 229, 243);
            display: flex;
            height: 5rem;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        #table1,
        #table2 {
            width: 95%;
            margin: 3rem 2.5%;
            border-collapse: collapse;
        }

        #table1 td,
        #table2 td {
            height: 8rem;
            text-align: center;
        }
        #table1 td{
            position: relative;
        }

        #table1 #td1 {
            width: 43%;
        }

        #table1 #td2 {
            width: 14%;
        }

        select {
            height: 4.5rem;
            width: 91%;
            font-size: 1.8rem;
            text-align: center;
        }

        #t1,
        #t2,
        #t3,
        #t4,
        #t6,
        #t5,
        #t7,
        #t8,
        #t9,
        #from,
        #to,
        #t11,
        #t12,
        #t13,
        #t14,
        #t15,
        #t16,
        #t19 {
            width: 90%;
            height: 4rem;
            padding-left: 1rem;
            font-size: 1.8rem;
        }
      

        #t3,
        #t4,
        #t5,
        #t11,
        #t12,
        #per_add,
        #cor_add {
            text-transform: capitalize;
        }

        #t17,
        #t18 {
            /* border: solid 2px red; */
            font-size: 1.8rem
        }
       

        #t9,
        #t13,
        #t14 {
            width: 92.5%;
        }

        #from,
        #to {
            width: 41%;
            font-size: 1.5rem;
        }

        #to {
            margin-left: 5%;
        }

        #chk {
            width: 2%;
            accent-color: green;
        }

        #chk_l {
            font-size: 2rem;
            margin-right: 1rem;
        }

        #cor_add {
            width: 78%;
        }

        #r {
            float: left;
            font-size: 1.8rem;
            margin-left: 0.5rem;
        }

        .radio {
            float: left;
            margin-left: 4rem;
        }

        #l1,
        #l2,
        #l3,
        #l4,
        #l5,
        #l6,
        #l7,
        #l8,
        #l10,
        #l9,
        #l11,
        #l12,
        #lf,
        #lt,
        #l13,
        #l14,
        #l15,
        #l16,
        #l17,
        #l18,
        #l41,
        #l51,
        #l52 {
            position: absolute;
            font-size: 1.8rem;
            margin: -1rem 4rem;
            background-color: white;
        }

        #l3,
        #l4,
        #l41,
        #l6,
        #l7,
        #l8,
        #l9,
        #l10,
        #l11,
        #l12,
        #l51,
        #l52,#l18 {
            visibility: hidden;
        }

        #l12 {
            margin-left: 11rem;
        }

        #lt {
            margin-left: 3%;
        }

        textarea {
            resize: none;
            width: 91%;
            height: 4rem;
            padding: 1rem 0 0 1rem;
            font-size: 1.8rem;
        }

        #l14,
        #l13 {
            right: 5rem;
            /* margin-left: 40rem; */
        }

        #ll1,
        #ll2,
        #ll3,
        #ll4,
        #ll5,
        #ll6,
        #ll7,
        #ll8,
        #ll9,
        #ll10,
        #ll11,
        #ll12,
        #ll13,
        #ll14,#ll15,#dtl {
            color: red;
            font-size: 1.6rem;
            float: left;
            margin-left: 3rem;
        }

        #b3,
        #b4,
        #b5,
        #b6,
        #b7 {
            font-weight: bolder;
            font-size: 1.7rem;
            height: 4rem;
            width: 13rem;
            border-radius: 1rem;
            cursor: pointer;
            background-color: green;
            color: white;
        }

        /* #d4{
            text-align: right;
        } */
        #b7 {
            background: blue;
            margin-left: 7rem;
            display: none;
        }

        .fa-search {
            position: absolute;
            font-size: 1.7rem;
            color: white;
            margin: 1.2rem 1.3%;
        }

        #b4,
        #b6 {
            background: red;
            margin-left: 7rem;
        }

        /* ------------ Service ----------------- */
        #table2 td {
            width: 33%;
        }

        #table2 #sr {
            text-align: center;
        }

        #d5 {
            height: 30rem;
            overflow-y: auto;
            margin-top: 3rem;
        }

        #table3 {
            width: 90%;
            /* margin-left: 5%; */
            text-align: center;
            font-size: 1.8rem;
            border-collapse: collapse;
        }

        #table3 .tr1:hover{
            background-color: rgb(167, 167, 247);
            color: white;
        }
        #del {
            color: red;
            font-weight: bold;
            padding: 1rem;
        }

        #upd {
            color: black;
            font-weight: bold;
            padding: 1rem;
        }

        #prt {
            color: rgb(4, 32, 83);
            font-weight: bold;
            padding: 1rem;
        }

        #del:hover,
        #upd:hover,
        #prt:hover {
            cursor: pointer;
            scale: 1.5;
            transition: .3s;

        }

        #table3 th,
        #table3 td {
            height: 3rem;
            border: .1rem solid black;
        }

        #table3 th {
            position: sticky;
            top: 0;
            background-color: antiquewhite;
        }

        #table3 #sn1,
        #table3 .sn {
            display: none;
        }

        #table3 input {
            border: none;
            outline: none;
        }

        #sa1 {
            height: 100%;
            width: 100%;
            border: none;
            outline: none;
        }

        #table3 tr:nth-child(odd) {
            background-color: rgb(184, 182, 182);
        }
        #std , #atd{
            height: 12rem;
            /* border: 2px solid red; */
            padding-bottom:.5rem;
        }
         #atd iframe{
            width: 100%;
            height: 100%;
         }
        #std div, #atd div{
            position: relative;
            width: 8rem;
            height: 8rem;
            /* height: 100%; */
            border: 2px solid black;
            /* padding: .5rem; */
            margin: auto;
        } 
         #atd div{
            width: 50%;
            height: 90%;
         }
         #atd > label , #std > label{
            top: 1rem;
            /* background: white; */
            left: -1rem;
            z-index: 1;
            color: red;
         }
         #t17,#t18{
            /* position: absolute; */
            width: 100%;
            height: 100%;
            /* padding-left: -1rem; */
         }
         
        #simg,#aimg{
            width: 4rem;
            height: 4rem;
        }
        #simg,#aimg,#spic,#apic,#dob,#reg_date,#bd,#ds,#st{
            border: none;
            background-color:transparent;
        }
        #img-box{
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin-bottom: 3rem;
          
        }
        #img-box div{
            width: 40%;
            height: 10rem;
            border: 2px solid black;
            position: relative;
        }
        #img-box div label{
            position: absolute;
            left: 0;
        }
        #img-box div img{
            width: 10rem;
            height: 10rem;
        }
        #img-box iframe{
            height: 10rem;
            width: 100%;
        }


        @media (max-width:998px) {
            html {
                font-size: 55%;
            }
        }

        @media (max-width:768px) {

            html {
                font-size: 45%;
            }

            #table1 #td1 {
                width: 100%;
            }

            #table1 #td2 {
                display: none;
            }

            #table3 th {
                display: none;
            }

            #table1 td,
            #table2 td,
            #table3 td,#simg,#aimg,#spic,#apic,#dob,#reg_date,#bd,#ds,#st {
                display: block;
            }
            #simg,#aimg,#spic,#apic,#dob,#reg_date,#bd,#ds,#st{
                height: auto;
                width: auto;
                float: right;
                padding-top: 0.5rem;
            }
            #spic,#apic{
                padding-top: 0;
            }
            #table2 td {
                width: 100%;
            }
            #simg,#aimg{
                height: 0.2rem;
                width: 0.2rem;
            }
            #lt {
                margin-left: 9%;
            }

            /* #d4{
                display: flex;
                flex-wrap:wrap;
                justify-content: space-around;
                margin-left: 2rem;
            } */
            #b5 {
                margin-left: 0;
            }

            #table2 #sr {
                text-align: center;
            }

            .fa-search {
                margin: 1rem 2rem;
            }

            #d5 {
                height: auto;
            }

            #table3 .sn {
                display: block;
                background-color: antiquewhite;
            }

            #table3 td {
                text-align: right;
            }

            #table3 td::before {
                content: attr(data-label);
                float: left;
                font-weight: bold;
                color: black;
            }

            #sa1 {
                width: 50%;
            }
            #table3{
                margin-left: 5%;
            }
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="d1">
            <div id="hm"><a href="dashbord.html" id="home">
                    <font size="4rem" style="color: white;">&#x1F3E0; &nbsp; HOME</font>
                </a></div>
            <div id="tog">
                <div id="togx"></div>
                <p id="b1"><b>Entry</b></p>
                <p id="b2"><b>Service</b></p>
            </div>
        </div>
        <div id="body">
            <div id="ent">
                <div id="d2"><b>Registration &nbsp; Entry</b></div>
                <form>
                    <table id="table1">
                        <tr>
                            <td id="td1"><label id="l1">Reg. Form No</label><input type="text" id="t1"
                                    placeholder="Reg. Form No" readonly></td>
                            <td id="td1"><label id="l2">Reg. Date</label><input type="date" id="t2"
                                    placeholder="Reg. Date" onchange="dtchk('#t2','#dtl')"><br><label id="dtl"></label></td>

                        </tr>
                        <tr>
                            <td><label id="l3">Student Name<font style="color: red;">*</font></label><input type="text"
                                    id="t3" autocomplete="off" placeholder="Student Name*" oninput="input('#t3','#l3')"
                                    onfocus="ch3('#t3')" onfocusout="ch2('#t3')"
                                    onkeydown="keychk('#t3','#ll1')"><br><label id="ll1"></label></td>
                            <td><label id="l4">Father's Name<font style="color: red;">*</font></label><input type="text"
                                    id="t4" autocomplete="off" placeholder="Father's Name*" oninput="input('#t4','#l4')"
                                    onfocus="ch3('#t4')" onfocusout="ch2('#t4')"
                                    onkeydown="keychk('#t4','#ll2')"><br><label id="ll2"></label></td>
                        </tr>
                        <tr>
                            <td><label id="l41">Mother's Name<font style="color: red;">*</font></label><input
                                    type="text" id="t5" autocomplete="off" placeholder="Mother's Name*"
                                    oninput="input('#t5','#l41')" onfocus="ch3('#t5')" onfocusout="ch2('#t5')"
                                    onkeydown="keychk('#t5','#ll3')"><br><label id="ll3"></label></td>
                            <td><label id="l5">Date Of Birth<font style="color: red;">*</font></label><input type="date"
                                    id="t6" onchange="dtchk('#t6','#ll4')"><br><label id="ll4"></label></td>
                        </tr>
                        <tr>
                            <td><label id="l6">Email ID</label><input type="email" id="t7"
                                    placeholder="Email ID (Optional)" autocomplete="off" oninput="input('#t7','#l6')"
                                    onfocus="ch3('#t7')" onfocusout="email()" f
                                    onkeydown="keychk('#t7','#ll5')"><br><label id="ll5"></label></td>
                            <td><label id="l7">Contact No.<font style="color: red;">*</font></label><input type="text"
                                    id="t8" placeholder="Contact No.*" autocomplete="off" maxlength="10" minlength="10" oninput="input('#t8','#l7')"
                                    onfocus="ch3('#t8')" onfocusout="ch2('#t8')"
                                    onkeydown="keychk('#t8','#ll6')" inputmode="numeric"><br><label id="ll6"></label></td>
                        </tr>
                        <tr>
                            <td><label id="l8">Blood Grp.<font style="color: red;">*</font></label><select
                                    style="height: 4.5rem;" id="t9" onchange="cmbchk('#t9','#l8')" onfocus="ch3('#t9')"
                                    onfocusout="ch2('#t9')">
                                    <option value="" selected disabled>----- Select Any Blood Group -----</option>
                                    <option value="A">A</option><option value="B">B</option><option value="AB">AB</option><option value="O">O</option><option value="A-">A-</option><option value="B-">B-</option><option value="AB-">AB-</option><option value="O-">O-</option>
                                </select><br><label id="ll7"></label></td>
                            <td><label
                                    style="font-size: 2rem;float: left;margin-left: 2.5rem;margin-bottom: 1.5rem;">Gender</label><input
                                    type="radio" name="rd" id="dr1" class="radio" checked value="Male"><label for="dr1"
                                    id="r">Male</label><input type="radio" name="rd" id="dr2" class="radio" value="Female"><label
                                    for="dr2" id="r">Female</label><input type="radio" name="rd" id="dr3"
                                    class="radio" value="Binary"><label for="dr3" id="r">Binary</label></td>
                        </tr>
                        <tr>
                            <td><label id="l51">College Name<font style="color: red;">*</font></label><input type="text"
                                    id="t11" autocomplete="off" placeholder="College Name*"
                                    oninput="input('#t11','#l51')" onfocus="ch3('#t11')" onfocusout="ch2('#t11')"
                                    onkeydown="keychk('#t11','#ll8')"><br><label id="ll8"></label></td>
                            <td><label id="l52">Program Name<font style="color: red;">*</font></label><input type="text"
                                    id="t12" autocomplete="off" placeholder="Program Name*"
                                    oninput="input('#t12','#l52')" onfocus="ch3('#t12')" onfocusout="ch2('#t12')"
                                    onkeydown="keychk('#t12','#ll8')"><br><label id="ll9"></label></td>
                        </tr>
                        <tr>
                            <td><label id="l9">State<font style="color: red;">*</font></label><select
                                    style="height: 4.5rem;" id="t13" onchange="cmbchk('#t13','#l9')"
                                    onfocus="ch3('#t13')" onfocusout="ch2('#t13')">
                                    <option value="" selected disabled>----- Select Any State -----</option>
                                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                                    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                                    <option value="Assam">Assam</option>
                                    <option value="Bihar">Bihar</option>
                                    <option value="Chandigarh">Chandigarh</option>
                                    <option value="Chattisgarh">Chattisgarh</option>
                                    <option value="Delhi">Delhi</option>
                                    <option value="Goa">Goa</option>
                                    <option value="Gujarat">Gujarat</option>
                                    <option value="Haryana">Haryana</option>
                                    <option value="Himachal Pradesh">Himachal Pradesh</option>
                                    <option value="jammu & Kashmir">Jammu & Kashmir</option>
                                    <option value="Jharkhand">Jharkhand</option>
                                    <option value="Karnataka">Karnataka</option>
                                    <option value="Kerala">Kerala</option>
                                    <option value="Lakshadweep">Lakshadweep</option>
                                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                                    <option value="Maharashtra">Maharashtra</option>
                                    <option value="Manipur">Manipur</option>
                                    <option value="Meghalaya">Meghalaya</option>
                                    <option value="Mizoram">Mizoram</option>
                                    <option value="Odisha">Odisha</option>
                                    <option value="Punjab">Punjab</option>
                                    <option value="Rajasthan">Rajasthan</option>
                                    <option value="Sikkim">Sikkim</option>
                                    <option value="Tamil Nadu">Tamil Nadu</option>
                                    <option value="Telangana">Telangana</option>
                                    <option value="Tripura">Tripura</option>
                                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                                    <option value="Uttarakhand">Uttarakhand</option>
                                    <option value="West Bengal">West Bengal</option>
                                    <option value="Andaman & Nicobar">Andaman & Nicobar</option>
                                    <option value="Dadra & Nagar Haveli and Daman & Diu">Dadra & Nagar Haveli and Daman
                                        & Diu</option>
                                    <option value="Pondicherry">Pondicherry</option>
                                    <option value="Nagaland"> Nagaland</option>
                                </select><br><label id="ll10"></label></td>
                            <td><label id="l10">District<font style="color: red;">*</font></label><select
                                    style="height: 4.5rem;" id="t14" disabled onchange="cmbchk('#t14','#l10')"
                                    onfocus="ch3('#t14')" onfocusout="ch2('#t14')">
                                    <option value="" selected disabled>----- Select Any District -----</option>
                                </select><br><label id="ll11"></label></td>
                        </tr>
                        <tr>
                            <td><label id="l11">Permanent Add.<font style="color: red;">*</font></label><textarea
                                    autocomplete="off" placeholder="Permanent Add.*" id="per_add"
                                    oninput="input('#per_add','#l11')" onfocus="ch3('#per_add')"
                                    onfocusout="ch2('#per_add')"
                                    onkeydown="keychk('#per_add','#ll12')"></textarea><br><label id="ll12"></label></td>
                            <td><label id="l12">Correspondence Add.<font style="color: red;">*</font></label><input
                                    type="checkbox" disabled name="" id="chk" value="Same"><label for="chk"
                                    id="chk_l">Same</label><textarea autocomplete="off"
                                    placeholder="Correspondence Add.*" id="cor_add" oninput="input('#cor_add','#l12')"
                                    onfocus="ch3('#cor_add')" onfocusout="ch2('#cor_add')"
                                    onkeydown="keychk('#cor_add','#ll13')"></textarea><br><label id="ll13"></label></td>
                        </tr>
                        <tr>
                            <td style="margin-bottom: 2rem;"><label id="l13">Student Pic</label><input type="file" src="" id="t15" alt=""
                                    style="padding-top: 0.5rem;border: solid 1px;" onchange="image('#t15','#t17')"></td>
                            <td><label id="l14">Adhaar Pic</label><input type="file" src="" id="t16" alt=""
                                    style="padding-top: 0.5rem;border: solid 1px;" onchange="image('#t16','#t18')"></td>
                        </tr>
                        <tr>
                            <td style="margin-bottom: 4rem;" colspan="2" >
                               <div id="img-box">
                                <div>
                                    <label id="l15">Student Pic</label>
                                    <img src="Shivam_Pic.jpg" alt="" id="t17">
                                </div>
                                <!-- </td> -->
                                <!-- <td  id="atd" style="display: none;"> -->
                                <div>
                                    <label id="l16">Adhaar Pic</label>
                                    <iframe src="DocumentsForPAN.pdf" frameborder="0"></iframe>
                                </div>
                               </div>
                            </td>
                            
                        </tr>
                        <tr>
                            <td colspan="2"><input type="button" value="&#x2713; Submit" id="b3"><input type="button"
                                    value="&#x21bb;&nbsp; Reset" id="b4"></td>
                        </tr>
                    </table>
                </form>
            </div>
            <div id="ser">
                <div id="d2"><b>Registration &nbsp; Service</b></div>
                <table id="table2">
                    <tr>
                        <td><label id="l17">Your Choice</label><select id="s1" onfocus="ch3('#s1')" onfocusout="ch2('#s1')" onchange="cmbchk('#s1','#l17')">
                                <option value="" selected disabled>----- Select Any One -----</option>
                                <option value="reg_no">Registration No.</option>
                                <option value="cont_no">Contact No.</option>
                                <option value="sname">Student Name</option>
                                <option value="blood_grp">Blood Group</option>
                                <option value="prog">Program Name</option>
                                <option value="clg_name">College Name</option>
                            </select><br><label id="ll14"></label></td>
                        <td>
                            <label id="l18">Your Choice</label><input type="text" class="lab"
                            id="t19" autocomplete="off" placeholder="Select Your Choice*"
                            oninput="input('#t19','#l18')" onfocus="ch3('#t19')" onfocusout="ch2('#t19')" readonly>
                            <select style="display: none;" id="s2" onfocus="ch3('#s2')" class="cmb" onfocusout="ch2('#s2')" onchange="cmbchk('#s2','#l18')">
                                <option value="" selected disabled>----- Select Any One -----</option>
                            </select><br><label id="ll15"></label>
                        </td>
                        <td><label id="lf">From</label><input type="date" id="from"><label id="lt">To</label><input
                                type="date" id="to"></td>
                    </tr>
                    <tr>
                        <td id="sr" colspan="3"><i class="fa fa-search" hidden></i><input type="button"
                                value=" &nbsp; Search" id="b5"><input type="button" value="&#x21bb;&nbsp; Refresh"
                                id="b6"><input type="button" class="fa" value="&#xf019;&nbsp; Download" id="b7"></td>
                    </tr>
                </table>
                <div id="d3"></div>
            </div>
        </div>

                    else if (!(e.which >= 48 && e.which <= 57 || e.which == 8 || e.which == 13)) {

                        return false;
                    }
                    else {
                        $(d).text("");
                    }
                });
            }
            else if (chk == '#t3' || chk == '#t4' || chk == '#t5' || chk == '#t11' || chk == '#t12') {
                $(chk).on('keypress', function (e) {
                    if (e.which == 32 && e.target.selectionStart == 0 || e.which == 46 && e.target.selectionStart == 0) {
                        $(d).text("Space and Dot At First Not Allowed!");
                        return false;
                    }
                    else if (!(e.which >= 65 && e.which <= 90 || e.which >= 97 && e.which <= 122 || e.which === 32 || e.which == 13 || e.which == 46)) {
                        $(d).text("Only Alphabet Allowed!");
                        return false;
                    }
                    else if (e.which === 32 && $(this).val().slice(-1) === ' ' || e.which === 46 && $(this).val().slice(-1) === '.') {
                        e.preventDefault();
                    }
                    else {
                        $(d).text("");
                    }
                });
            }
            else if (chk == '#t7') {
                $(chk).on('keypress', function (e) {
                    if (e.which === 64 && e.target.selectionStart === 0 || e.which == 46 && e.target.selectionStart == 0 || e.which == 48 && e.target.selectionStart == 0) {
                        $(d).text("@,.,0 At First Not Allowed!");
                        return false;
                    }
                    else if (!(e.which >= 65 && e.which <= 90 || e.which >= 97 && e.which <= 122 || e.which >= 48 && e.which <= 57 || e.which === 46 || e.which === 64)) {
                        $(d).text("Only Alphabet, Digit, @ & Comma Allowed!");
                        return false;
                    }
                    else if (e.which === 64 && $(this).val().slice(-1) === '@' || e.which === 46 && $(this).val().slice(-1) === '.') {
                        e.preventDefault();
                    }
                    else {
                        $(d).text("");
                    }
                });
            }
        }
        // --------------------------Email Validation-------------
        function email() {
            const last = [".com", ".org", ".in", ".net", ".edu", ".gov", ".mil", ".biz", ".info", ".pro", ".name", ".coop", ".aero", ".museum", ".asia", ".cat", ".jobs", ".mobi", ".tel", ".travel", ".xxx", ".arpa", ".int", ".post", ".root", ".test"];
            var str = $('#t7').val();
            var emailchk = false;
            if (str.trim().length > 0) {
                if (str.includes(".")) {
                    var s = str.substring(str.lastIndexOf('.'), str.length);
                    for (var i = 0; i < last.length; i++) {
                        if (last.includes(s)) {
                            emailchk = true;
                        }
                    }
                }
                else {
                    $('#ll5').html("*Please enter a valid email Id!");
                }
                if (emailchk) {
                    if (str.includes("@")) {
                        var index1 = str.indexOf("@");
                        var index2 = str.indexOf(".");
                        if (index2 == (index1 + 1)) {
                            $('#t7').css("border", "solid 1px red");
                            $('#ll5').html("*Please enter a valid email Id!");
                        }
                        else
                            $('#ll5').html("");

                    }
                    else {
                        $('#t7').css("border", "solid 1px red");
                        $('#ll5').html("*Please enter a valid email Id!");
                    }
                }
                else {
                    $('#t7').css("border", "solid 1px red");
                    $('#ll5').html("*Please enter a valid email Id!");
                }
            }
            else
                $('#ll5').html("");
        }
