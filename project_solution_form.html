<html>
    <head>
        <style>
            html{
                font-size: 10px;
            }
            body{
                background-color: antiquewhite;
            }
            #b1{
                height: 3.7rem;
                width: 30rem;
                border: .2rem solid black;
                margin: auto;
                text-align: center;
                border-radius: 5rem;
                cursor: pointer;
            }
            #b1 button{
                font-size: 2.5rem;
                border: none;
                height: 100%;
                width: 100%;
                border-radius:5rem;
                cursor: pointer;
            }
            #main{
                height: auto;
                width: 100%;
                overflow:hidden;
            }
            #e_f,#s_f{
                transition: .3s linear;
                height: 63rem;
                width: 99%;
                margin-top: 2rem;
                border: .1rem solid rgb(41, 36, 36);
                position: relative;
            }
            #s_f{
                margin-left: 100%;
            }
            h1{
                font-size: 3rem;
                text-align: center;
            }
            #tab1{
                width: 80%;
                margin-left: 10%;

            }
            #td1{
                width: 40%;
            }
            #td2{
                width: 20%;
            }
            input,select{
                width: 100%;
                height: 4rem;
                font-size: 1.8rem;
                padding-left: 1rem;
                border-radius: .5rem;
                /* border: none;
                outline: none; */
            }
            select{
                text-align: center;
            }
            #t2,#t4{
                text-transform: capitalize;
            }
            #l2,#l3,#l4,#l5{
                position: absolute;
                font-size: 1.8rem;
                margin: 9px 0 0 3rem;
                background:linear-gradient(to bottom,antiquewhite 50%,white 50%);
                border-radius: .5rem;
                visibility:hidden;
            }
            #l1{
                position: absolute;
                color: red;
                margin-left: 5%;
                font-size: 2rem;
            }
            #l22,#l44,#l55{
                position: absolute;
                color: red;
                font-size: 1.5rem;
                margin-left: 15%;
            }
            #b3,#b2,#b4,#b5,#b6,#b7{
                width: 17%;
                border-radius: 2rem;
                cursor: pointer;
                background-color: green;
                color: white;
            }
            #b3,#b5,#b7{
                margin-left: 10%;
                background-color: red;
            }
            #b6,#b7{
                width: 12%;
            }
            #search{
                height: 40rem;
            }
            #tab3,#tab3 th,#tab3 td{
                border: .1rem solid black;
                border-collapse:collapse ;
            }
            #tab3 tr{
                height: 4rem;
            }
            #tab3 input{
                height: 18px;
                width: 18px;
                cursor: pointer;
            }
            #tab3{
                width: 99%;
                font-size: 2rem;
                text-align: center;
            }
            #sticky{
                position: sticky;
                top: 0;
                background-color: white;
            }
            @media (max-width:998px) {
                html{
                    font-size: 55%;
                }
            }
            @media (max-width:768px) {
                html{
                    font-size: 45%;
                }
                #tab1{
                    width: 90%;
                    margin-left: 5%;
                }
                #td1{
                    width: 45%;
                }
                #td2{
                    width: 10%;
                }
            }
        </style>
    </head>
    <body>
        <div id="main">
            <!-- <div></div> -->
            <div id="b1"><button id="b11">Click for Service Form</button></div>
            <div id="e_f">
                <h1><b>ENTRY &nbsp;&nbsp; FORM</b></h1>
                <form>
                    <table id="tab1">
                        <tr>
                            <td id="td1"><select id="t1" onfocusout="ch2('#t1','#l1')" onfocus="ch3('#t1','#l1')">
                                <option value="" selected disabled>-------- Subject --------</option>
                                <option value="Web Development in Python">Web Development in Python</option>
                                <option value="Web Development in PHP">Web Development in PHP</option>
                                <option value="UI Designing">UI Designing</option>
                                <option value="Desktop Application in Java">Desktop Application in Java</option>
                            </select><br><label id="l1"></label></td>
                            <td id="td2"></td>
                            <td id="td1"><label id="l2">Topic</label><br><input type="text" id="t2" placeholder="Topic" oninput="la('#l2','#t2')" onfocusout="ch('#t2')" onfocus="ch1('#t2')" onkeydown="val('#t2','#l22')"><br><label id="l22"></label></td>
                        </tr>
                        <tr>
                            <td><label id="l3">Technology</label><br><input type="text" id="t3" placeholder="Technology" oninput="la('#l3','#t3')" onfocusout="ch('#t3')" onfocus="ch1('#t3')"></td>
                            <td></td>
                            <td><label id="l4">Guide</label><br><input type="text" id="t4" placeholder="Guide Name" oninput="la('#l4','#t4')" onfocusout="ch('#t4')" onfocus="ch1('#t4')" onkeydown="val('#t4','#l44')"><br><label id="l44"></label></td>
                        </tr>
                        <tr>
                            <td><label id="l5">Link</label><br><input type="text" id="t5" placeholder="Video Link" oninput="la('#l5','#t5')" onfocusout="ch('#t5')" onfocus="ch1('#t5')"></td>
                            <td></td>
                            <td></td>
                        </tr>
                        <tr>
                            <td colspan="3" style="text-align: center;"><br><br><input type="button" value="Submit" id="b2"><input type="button" value="Reset" id="b3"></td>
                        </tr>
                    </table>
                </form>
            </div>
            <div id="s_f" hidden>
                <h1><b>SERVICE &nbsp;&nbsp; FORM</b></h1>
                <form>
                    <table id="tab1">
                        <tr>
                            <td id="td1"><select id="s1"><option selected disabled value="">-------- Select Subject --------</option></select></td>
                            <td id="td2"></td>
                            <td id="td1"><select id="s2"><option selected disabled value="">-------- Select Topic --------</option></select></td>
                        </tr>
                        <tr>
                            <td colspan="3" style="text-align: center;"><br><br><input type="button" value="Search" id="b4"><input type="button" value="Reset" id="b5"></td>
                        </tr>
                    </table>
                </form>
                <div id="search">
                </div>
            </div>
        </div>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.js"></script>
        <script>
            // --------------------------------------------- Hide Show --------------------------------------------
            var b1=0;
            $('#b1').click(function(){
                if(b1==0){
                    $('#s_f').show();
                    $('#e_f').hide();
                    $('#b11').html('Click for Entry Form');
                    $('#s_f').animate(
                        { left:'-100%'}
                    );
                    $('#e_f').animate(
                        {left:'-100%'}
                    );
                    b1=1;
                }
                else{
                    $('#e_f').show();
                    $('#s_f').hide();
                    $('#b11').html('Click for Service Form');
                    $('#e_f').animate(
                        { left:'0%'}
                    );
                    $('#s_f').animate(
                        {left:'100%'}
                    );
                    b1=0;
                }
            });
            function la(l,t){
                a=$(t).val().trim()
                    if(a=='')
                        $(l).css('visibility','hidden');
                    else
                        $(l).css('visibility','visible');
            }
            // -------------------------------------------------------------------------------------------------------
            // ############################################### Entry #################################################
            // ----------------------------------------------- Validation --------------------------------------------
            var flag=true
            function ch(t){
                var a=$(t).val();
                if (a.trim().length==0)
                {
                    $(t).val('*Field is mandatory!');
                    $(t).css({'border':'2px solid red','color':'red'});
                    flag=false
                }
                else if(a=="*Field is mandatory!")
                    flag=false
            }
            function ch1(t){
                var a=$(t).val()
                if(a=="*Field is mandatory!"){
                    $(t).val('');
                }
                    $(t).css({'border':'1px solid black','color':'black'});
            };
            function ch2(t,l){
                if($(t).val()==null){
                    flag=false;
                    $(t).css('border','2px solid red')
                    $(l).html('Select any one!')
                }
            }
            function ch3(t,l){
                $(t).css('border','1px solid black')
                $(l).html('')
            }
            $('input').keypress(function(a){
                if(a.which==32 && a.target.selectionStart==0)
                    return false
            })
            function val(t,l){
                $(l).html('')
                $(t).on('keypress',function(a){
                    if(!(a.which>=65 && a.which<=90 || a.which>=97 && a.which<=122 || a.which==32)){
                        $(l).html('Only alphabate allowed!')
                        return false
                    }
                    else if(a.which==32 && $(this).val().slice(-1)==' '){
                        $(l).html('Multiple space not allowed')
                        a.preventDefault();
                    }
                })
            }
            // --------------------------------------------------------------------------------------------------------
            // ------------------------------------------------ Submit -----------------------------------------------

            $('#b2').click(function(){
                flag=true
                ch('#t2')
                ch('#t3')
                ch('#t4')
                ch('#t5')
                ch2('#t1','#l1')
                if(flag){
                    a=$('#t1').val()
                    b=$('#t2').val()
                    c=$('#t3').val()
                    d=$('#t4').val()
                    e=$('#t5').val()
                    $.ajax({
                        url:'contact.py',
                        method:'post',
                        data:{
                            t1:'ent1',
                            t2:a,
                            t3:b,
                            t4:c,
                            t5:d,
                            t6:e
                        },
                        success:function(data){
                            alert(data)
                            cls()
                        }
                    })
                }
                else
                    alert("All field is required!")
            })
            $('#t2,#t3,#t4,#t5').on('keydown',function(a){
                if(a.which==13)
                    $('#b2').click()
            })
            function cls(){
                $('#t2').val('')
                $('#t3').val('')
                $('#t4').val('')
                $('#t5').val('')
                ch1('#t2')
                ch1('#t3')
                ch1('#t4')
                ch1('#t5')
                ch3('#t1','#l1')
                $('#l2,#l3,#l4,#l5').css('visibility','hidden')
            }
            $('#b3').click(function(){
                cls()
            })
            // ############################################ Service ####################################################
            $('#b11').click(function(){
                if(b1==0){
                    $('#search').html('')
                    $('#s2').html('<option selected disabled value="">-------- Select Topic --------</option>')
                    $.ajax({
                        url:'contact.py',
                        method:'post',
                        data:{
                            t1:'presload'
                        },
                        success:function(data){
                            $('#s1').html('<option selected disabled value="">-------- Select Subject --------</option>')
                            $('#s1').append(data)
                        }
                    })
                }
                else{
                    cls()
                    $('#t1').val(null)
                }
            })
            $('#s1').on('change',function(){
                a=$(this).val()
                $.ajax({
                    url:'contact.py',
                    method:'post',
                    data:{
                        t1:'presload1',
                        t2:a
                    },
                    success:function(data){
                        $('#s2').html('<option selected disabled value="">-------- Select Topic --------</option>')
                        $('#s2').append(data)
                    }
                })
            })
            // -------------------------------------- Search -----------------------------------------------------
            $('#b4').click(function(){
                $('#b5').prop('disabled',false)
                a=$('#s1').val();
                b=$('#s2').val();
                if(a!=null)
                        $.ajax({
                            url:'contact.py',
                            method:'post',
                            data:{
                                t1:'pressearch',
                                t2:a,
                                t3:b
                            },
                            success:function(data){
                                if(data==1){
                                    $('#search').html('')
                                    alert("Record not found!")
                                }
                                else
                                    $('#search').html(data)
                            }
                        })
                else
                    alert("Plese select Subject!")
            })
            $('#b5').click(function(){
                $('#search').html('')
                $('#s2').html('<option selected disabled value="">-------- Select Topic --------</option>')
                $('#s1').val(null)
                $(this).prop('disabled',true)
            })
            // ----------------------------------------------------------------------------------------------
            $(document).on('blur','#e',function(){
                a=$(this).text()
                $(this).text(a+"   ")
            });
            $(document).on('focus','#e',function(){
                a=$(this).text().trim()
                $(this).text(a)
            });
            // ------------------------------------------------- Update ---------------------------------------------
            $(document).on('click','#b6',function(){
                var cell = $("input[name='a']:checked").closest('tr').children("td").text().split('   ');
                if(cell[0]=='')
                    alert('Please select any row!')
                else{
                    var log=confirm("Are you sure want to update this!")
                    if(log)
                    $.ajax({
                        url:'contact.py',
                        method:'post',
                        data:{
                            t1:'presup',
                            t2:cell[1],
                            t3:cell[2],
                            t4:cell[3],
                            t5:cell[4],
                            t6:cell[5],
                            t7:cell[0]
                        },
                        success:function(data){
                            alert(data)
                        }
                    })
                }
            })
            // ------------------------------------------------- Delete ---------------------------------------------
            $(document).on('click','#b7',function(){
                var cell = $("input[name='a']:checked").closest('tr').children("td").text().split('   ');
                if(cell[0]=='')
                    alert('Please select any row!')
                else{
                    var log=confirm("Are you sure want to delete this!")
                    if(log)
                    $.ajax({
                        url:'contact.py',
                        method:'post',
                        data:{
                            t1:'presdl',
                            t2:cell[0]
                        },
                        success:function(data){
                            alert(data)
                            $("input[name='a']:checked").closest('tr').remove()
                        }
                    })
                }
            })
        </script>
    </body>
</html>
