<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Certificate Form</title>
    <link rel="icon" href="repllogo.png">
    <style>
        html{
            font-size: 10px;
        }
        body{
            margin: 0;
            overflow-x: hidden;
        }
        #main{
            width: 100%;
            height: auto;
            overflow-x: hidden;
        }
        #d1{
            height: 7rem;
            background-color: rgb(77, 169, 244);
        }
        #hm{
            height: 7rem;
            width: auto;
            display: flex;
            align-items: center;
            float: left;
        }
        #d1 a{
            text-decoration: none;
            margin:3rem;
        }
        #tog{
            margin: 1.5rem 3rem;
            height: 4rem;
            width: 20rem;
            display: flex;
            float: right;
        }
        #togx{
            position: absolute;
            height: 4rem;
            width: 10rem;
            background-color: white;
            transition: .3s;
            /* margin-left: 10rem; */
            border-radius: 1rem 0 0 1rem;
            /* box-shadow: 2px 2px 10px rgb(249, 65, 237); */
        }
        #tog p{
            margin: 0;
            position: relative;
            height: 100%;
            width: 50%;
            cursor: pointer;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            font-size: 2rem;
        }
        #b1{
            border-radius: 1rem 0 0 1rem;
        }
        #b2{
            border-radius:0 1rem 1rem 0;
        }
        #body{
            width: 200%;
            transition: .5s;
        }
        #ent,#ser{
            height: auto;
            width: 50%;
            float: left;
        }
        #d2{
            background-color: rgb(179, 229, 243);
            display: flex;
            height: 5rem;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        #table1,#table2{
            width: 95%;
            margin: 3rem 2.5%;
            border-collapse:collapse;
        }
        #table1 td,#table2 td{
            height: 8rem;
            text-align: center;
        }
        #table1 #td1{
            width: 43%;
        }
        #table1 #td2{
            width: 14%;
        }
        select{
            height: 4.5rem;
            width:91%;
            font-size: 1.8rem;
            text-align: center;
        }
        #t1,#t2,#t3,#t4,#t6,#t5,#t7,#t8,#from,#to{
            width: 90%;
            height: 4rem;
            padding-left: 1rem;
            font-size: 1.8rem;
        }
        #from,#to{
            width: 41%;
            font-size: 1.5rem;
        }
        #to{
            margin-left: 5%;
        }
        #l1,#l2,#l3,#l4,#l5,#l6,#l7,#l8,#l9,#lf,#lt{
            position: absolute;
            font-size: 1.8rem;
            margin: -1rem 4rem;
            background-color: white;
        }
        #lt{
            margin-left: 3%;
        }
        #ll1,#ll2,#ll3{
            color: red;
            font-size: 1.6rem;
            float:left;
            margin-left: 3rem;
        }
        #b3,#b4,#b5,#b6,#b7{
            font-weight: bolder;
            font-size: 1.7rem;
            height: 4rem;
            width: 13rem;
            border-radius: 1rem;
            cursor: pointer;
            background-color: green;
            color: white;
        }
        #d4{
            text-align: right;
        }
        #b7{
            background:blue;
            margin-left: 7rem;
        }
        #b10{
            background:red;
        }
        .fa-search{
            position: absolute;
            font-size: 1.7rem;
            color:white;
            margin: 1rem 14%;
        }
        #b4,#b6{
            background: red;
            margin-left: 7rem;
        }
        #b5{
            margin-left: 20%;
        }
        /* ------------ Service ----------------- */
        #table2 td{
            width: 33%;
        }
        #table2 #sr{
            text-align: left;
        }
        #d5{
            height: 30rem;
            overflow-y: auto;
            margin-top: 3rem;
        }
        #table3{
            width: 90%;
            margin-left: 5%;
            text-align: center;
            font-size: 1.8rem;
            border-collapse:collapse;
        }
        #table3 .tr1:hover{
            background-color: rgb(167, 167, 247);
            color: white;
        }
        #del{
            color: red;
            font-weight: bold;
        }
        #upd{
            color: black;
            font-weight: bold;
        }
        #del:hover,#upd:hover{
            cursor: pointer;
            scale: 1.5;
            transition: .3s;

        }
        #table3 th,#table3 td{
            height: 3rem;
            border: .1rem solid black;
        }
        #table3 th{
            position: sticky;
            top: 0;
            background-color:antiquewhite;
        }
        #table3 #sn1,#table3 .sn{
            display: none;
        }
        #table3 input{
            border: none;
            outline: none;
        }
        #table3 tr:nth-child(odd){
            background-color: rgb(184, 182, 182);
        }
        #sa1{
            height: 100%;
            width: 100%;
            border: none;
            outline: none;
        }
        @media (max-width:998px) {
            html{
                font-size: 55%;
            }
        }
        @media (max-width:768px) {

            html{
                font-size: 45%;
            }
            #table1 #td1{
                width: 100%;
            }
            #table1 #td2{
                display: none;
            }
            #table3 th{
                display: none;
            }
            #table1 td,#table2 td,#table3 td{
                display: block;
            }
            #table2 td{
                width: 100%;
            }
            #lt{
                margin-left: 9%;
            }
            #d4{
                display: flex;
                flex-wrap:wrap;
                justify-content: space-around;
                margin-left: 2rem;
            }
            #b5{
                margin-left: 0;
            }
            #table2 #sr{
                text-align: center;
            }
            .fa-search{
                margin: 1rem 2rem;
            }
            #d5{
                height: auto;
            }
            #table3 .sn{
                display: block;
                background-color: antiquewhite;
            }
            #table3 td{
                text-align: right;
            }
            #table3 td::before {
                content: attr(data-label);
                float: left;
                font-weight: bold;
                color: black;
            }
            #sa1{
                width: 50%;
            }
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="d1">
                <div id="hm"><a href="#" id="home"><font size="4rem">&#x1F3E0; &nbsp; HOME</font></a></div>
                <div id="tog"><div id="togx"></div><p id="b1"><b>Entry</b></p><p id="b2"><b>Service</b></p></div>
        </div>
        <div id="body">
            <div id="ent">
                <div id="d2"><b>Certificate &nbsp; Entry</b></div>
                <form>
                    <table id="table1">
                        <tr>
                            <td id="td1"><label id="l1">Certificate No</label><input type="text" id="t1" placeholder="Cert No" readonly></td>
                            <td id="td1"><label id="l2">Date</label><input type="date" id="t2" placeholder="Date"></td>
                        </tr>
                        <tr>
                            <td><label id="l3">Registration No</label><input type="text" id="t3" placeholder="Registration No"><label id="ll1">Reg</label></td>
                            <td><label id="l4">Course</label><select style="height: 4.6rem;width: 92.5%;" id="t4"><option value="" selected disabled>----- Select Any One -----</option></select><br><label id="ll2">Course</label></td>
                        </tr>
                        <tr>
                            <td><label id="l5">Student Name</label><input type="text" id="t5" placeholder="Student Name" readonly></td>
                            <td><label id="l6">Certificate Dur.</label><input type="text" id="t6" placeholder="Certificate Dur."readonly></td>
                        </tr>
                        <tr>
                            <td><label id="l7">Father's Name</label><input type="text" id="t7" placeholder="Father's Name" readonly></td>
                            <td><label id="l8">Date Of Birth</label><input type="date" id="t8" placeholder="Date Of Birth" readonly></td>
                        </tr>
                        <tr>
                            <td><input type="button" value="&#x2713; Submit" id="b3"><input type="button" value="&#x21bb;&nbsp; Reset" id="b4"></td>
                        </tr>
                    </table>
                </form>
            </div>
            <div id="ser">
                <div id="d2"><b>Certificate &nbsp; Service</b></div>
                <table id="table2">
                    <tr>
                        <td><label id="l9">Your Choice</label><select id="s1"><option value="" selected disabled>----- Select Any One -----</option><option value="Registration">Registration No.</option><option value="Certificate">Certificate No.</option><option value="Name">Student Name</option></select><br><label id="ll3">Choice</label></td>
                        <td><select id="s2"><option value="" selected disabled>----- Select Any One -----</option></select></td>
                        <td><label id="lf">From</label><input type="date" id="from"><label id="lt">To</label><input type="date" id="to"></td>
                    </tr>
                    <tr>
                        <td id="sr" colspan="2" ><i class="fa fa-search" hidden></i><input type="button" value=" &nbsp; Search" id="b5"><input type="button" value="&#x21bb;&nbsp; Refresh" id="b6"><input type="button" class="fa" value="&#xf019;&nbsp; Download" id="b7"></td>
                    </tr>
                </table>
                <div id="d3">
                    <div id="d5">
                        <table id="table3">
                            <tr><th id="sn">Sn</th><th>Certificate No</th><th>Registration No</th><th>Date Of Issue</th><th>Student Name</th><th>Father's Name</th><th>Date Of Birth</th><th>Course</th><th>Course Dur</th><th colspan="2">Check</th><th id="sn1"></th></tr>
                            <tr class="tr1"><td id="sn" data-label="SN">1</td><td data-label="Certificate No">P001</td><td data-label="Registration No">Ord0001</td><td data-label="Date Of Issue">UPI</td><td data-label="Student Name">22-07-2001</td><td data-label="Father's Name">15000</td><td data-label="Date Of Birth">5000</td><td data-label="Course">20000</td><td data-label="Course Dur" contenteditable="true" id="e">17000</td><td data-label="Update"><i class="fa" id="upd" data-toggle="tooltip" title="Update">&#xf044;</i></td><td data-label="Delete"><i class="fa" id="del" data-toggle="tooltip" title="Delete">&#xf014;</i></td><td class="sn"></td></tr>
                        </table>
                    </div>
                </div> 
            </div>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="//cdn.rawgit.com/rainabba/jquery-table2excel/1.1.0/dist/jquery.table2excel.min.js"></script>
    <script>
        sessionStorage.setItem('bcode','BR01');
        var bcode=sessionStorage.getItem('bcode');
        // ====================== Animation ===============================
        $('#b2').click(function(){
            $('#togx').css({'margin-left':'10rem','border-radius':'0 1rem 1rem 0'});
            $('#body').css('margin-left','-100%');
            $('#lf,#lt,.fa-search').show();
        })
        $('#b1').click(function(){
            $('#togx').css({'margin-left':'0rem','border-radius':'1rem 0 0 1rem'});
            $('#body').css('margin-left','0%');
            $('#lf,#lt,.fa-search').hide();
            $('#d3').html('');
        })
        // --------------------------------------------------------------------
       // ======================== Mandatory ===========================
        var flag=true;
        function ch2(t,l){
            a=$(t).val();
            if(a==null){
                $(t).css('border','2px solid red');
                $(l).html('Select any One!');
                flag=false;
            }
        }
        function ch3(t,l){
            $(t).css('border','1px solid black');
            $(l).html('');
        }
        // -----------------------------------------
        // ======================= Download==========================
        
        $(document).on('click','#b7',function(){
            $("#table3").table2excel({
                exclude: ".sn,#sn,#chk",
                filename: $('#s1').val()+"_exp.xls"
            });
        });
    </script>
</body>
</html>
