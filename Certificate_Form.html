<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Certificate Form</title>
    <link rel="icon" href="repllogo.png">
    <style>
        html{
            font-size: 10px;
        }
        body{
            margin: 0;
            overflow-x: hidden;
        }
        #main{
            width: 100%;
            height: auto;
            overflow-x: hidden;
        }
        #d1{
            height: 7rem;
            background-color: rgb(77, 169, 244);
        }
        #hm{
            height: 7rem;
            width: auto;
            display: flex;
            align-items: center;
            float: left;
        }
        #d1 a{
            text-decoration: none;
            margin:3rem;
        }
        #tog{
            margin: 1.5rem 3rem;
            height: 4rem;
            width: 20rem;
            display: flex;
            float: right;
        }
        #togx{
            position: absolute;
            height: 4rem;
            width: 10rem;
            background-color: white;
            transition: .3s;
            /* margin-left: 10rem; */
            border-radius: 1rem 0 0 1rem;
            /* box-shadow: 2px 2px 10px rgb(249, 65, 237); */
        }
        #tog p{
            margin: 0;
            position: relative;
            height: 100%;
            width: 50%;
            cursor: pointer;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            font-size: 2rem;
        }
        #b1{
            border-radius: 1rem 0 0 1rem;
        }
        #b2{
            border-radius:0 1rem 1rem 0;
        }
        #body{
            width: 200%;
            transition: .5s;
        }
        #ent,#ser{
            height: auto;
            width: 50%;
            float: left;
        }
        #d2{
            background-color: rgb(179, 229, 243);
            display: flex;
            height: 5rem;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        #table1,#table2{
            width: 95%;
            margin: 3rem 2.5%;
            border-collapse:collapse;
        }
        #table1 td,#table2 td{
            height: 8rem;
            text-align: center;
        }
        #table1 #td1{
            width: 43%;
        }
        #table1 #td2{
            width: 14%;
        }
        select{
            height: 4.5rem;
            width:91%;
            font-size: 1.8rem;
            text-align: center;
        }
        #t1,#t2,#t3,#t4,#t6,#t5,#t7,#t8,#t9,#t10,#t11,#from,#to{
            width: 90%;
            height: 4rem;
            padding-left: 1rem;
            font-size: 1.8rem;
        }
        #from,#to{
            width: 41%;
            font-size: 1.5rem;
        }
        #to{
            margin-left: 5%;
        }
        #l1,#l2,#l3,#l4,#l5,#l6,#l7,#l8,#l9,#l10,#l11,#lf,#lt{
            position: absolute;
            font-size: 1.8rem;
            margin: -1rem 4rem;
            background-color: white;
        }
        /* #s1,#t11{
            margin-top: 1.7rem;
        } */
        #lt{
            margin-left: 3%;
        }
        #ll1,#ll2,#ll3,#ll4{
            color: red;
            font-size: 1.6rem;
            float:left;
            margin-left: 3rem;
            visibility: hidden;
        }
        #l11,#l10,#l3,#l4,#l5,#l6{
            visibility: hidden;
        }
        #b3,#b4,#b5,#b6,#b7{
            font-weight: bolder;
            font-size: 1.7rem;
            height: 4rem;
            width: 13rem;
            border-radius: 1rem;
            cursor: pointer;
            background-color: green;
            color: white;
        }
        #d4{
            text-align: right;
        }
        #b7{
            background:blue;
            margin-left: 7rem;
            display: none;
        }
        #b10{
            background:red;
        }
        .fa-search{
            position: absolute;
            font-size: 1.7rem;
            color:white;
            margin: 1.2rem 1.5%;
        }
        #b4,#b6{
            background: red;
            margin-left: 7rem;
        }
        /* #b5{
            margin-left: 20%;
        } */
        /* ------------ Service ----------------- */
        #table2 td{
            width: 33%;
        }
        #table2 #sr{
            text-align: center;
        }
        #d5{
            height: 30rem;
            overflow-y: auto;
            margin-top: 3rem;
        }
        #table3{
            width: 90%;
            margin-left: 5%;
            text-align: center;
            font-size: 1.8rem;
            border-collapse:collapse;
        }
        #table3 .tr1:hover{
            background-color: rgb(167, 167, 247);
            color: white;
        }
        #del{
            color: red;
            font-weight: bold;
            padding: 1rem;
        }
        #upd{
            color: black;
            font-weight: bold;
            padding: 1rem;
        }
        #cert{
            color: rgb(9, 235, 9);
            font-weight: bold;
            padding: 1rem;
        }
        #mark{
            color: rgb(201, 235, 9);
            font-weight: bold;
            padding: 1rem;
        }
        #del:hover,#upd:hover,#cert:hover,#mark:hover{
            cursor: pointer;
            scale: 1.5;
            transition: .3s;

        }
        #table3 th,#table3 td{
            height: 3rem;
            border: .1rem solid black;
        }
        #table3 th{
            position: sticky;
            top: 0;
            background-color:antiquewhite;
        }
        #table3 #sn1,#table3 .sn{
            display: none;
        }
        #table3 input{
            border: none;
            outline: none;
        }
        #table3 tr:nth-child(odd){
            background-color: rgb(184, 182, 182);
        }
        #sa1{
            height: 100%;
            width: 100%;
            border: none;
            outline: none;
        }
        @media (max-width:998px) {
            html{
                font-size: 55%;
            }
        }
        @media (max-width:768px) {
            html{
                font-size: 45%;
            }
            #table1 #td1{
                width: 100%;
            }
            #table1 #td2{
                display: none;
            }
            #table3 th{
                display: none;
            }
            #table1 td,#table2 td,#table3 td{
                display: block;
            }
            #table2 td{
                width: 100%;
            }
            #lt{
                margin-left: 9%;
            }
            #d4{
                display: flex;
                flex-wrap:wrap;
                justify-content: space-around;
                margin-left: 2rem;
            }
            #b5{
                margin-left: 0;
            }
            #table2 #sr{
                text-align: center;
            }
            .fa-search{
                margin: 1rem 2rem;
            }
            #d5{
                height: auto;
            }
            #table3 .sn{
                display: block;
                background-color: antiquewhite;
            }
            #table3 td{
                text-align: right;
            }
            #table3 td::before {
                content: attr(data-label);
                float: left;
                font-weight: bold;
                color: black;
            }
            #sa1{
                width: 50%;
            }
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="d1">
                <div id="hm"><a href="#" id="home"><font size="4rem">&#x1F3E0; &nbsp; HOME</font></a></div>
                <div id="tog"><div id="togx"></div><p id="b1"><b>Entry</b></p><p id="b2"><b>Service</b></p></div>
        </div>
        <div id="body">
            <div id="ent">
                <div id="d2"><b>Training &nbsp; Certificate &nbsp; Entry</b></div>
                <form>
                    <table id="table1">
                        <tr>
                            <td id="td1"><label id="l1">Certificate No</label><input type="text" id="t1" placeholder="Certificate No." readonly></td>
                            <td id="td1"><label id="l2">Date Of Issue</label><input type="date" id="t2" readonly></td>
                        </tr>
                        <tr>
                            <td><label id="l3">Registration No</label><input type="text" id="t3" onfocusout="ch2('#t3')" placeholder="Registration No." maxlength="18" minlength="18" style="text-transform: uppercase;"><label id="ll1">Reg</label></td>
                            <td><label id="l4">Course</label><select style="height: 4.6rem;width: 92.5%;" id="t4"><option value="" selected disabled>----- Select Any One -----</option></select><br><label id="ll2">Course</label></td>
                        </tr>
                        <tr>
                            <td><label id="l5">Student Name</label><input type="text" id="t5" placeholder="Student Name" readonly></td>
                            <td><label id="l6">Father's Name</label><input type="text" id="t6" placeholder="Father's Name" readonly></td>
                        </tr>
                        <tr>
                            <td><label id="l7">Starting Date</label><input type="date" id="t7"></td>
                            <td><label id="l8">Ending Date</label><input type="date" id="t8"></td>
                        </tr>
                        <tr>
                            <td id="cent"><label id="l9">Study Centre Name</label><input type="text" id="t9" placeholder="Study Centre Name" readonly></td>
                            <td id="stu" style="display: none;"><label id="l10">Student Pic</label><img src="rayslogo1-1.png" alt="" id="t10" style="height: 15rem;width: 15rem;border: solid 1px;"></td>
                        </tr>
                        <tr style="display: none;" id="stur"><td></td></tr>
                        <!-- <input type="file" src="" id="t10" alt="" style="padding-top: 0.5rem;border: solid 1px;"><br> -->
                        <tr>
                            <td colspan="2"><input type="button" value="&#x2713; Submit" id="b3"><input type="button" value="&#x21bb;&nbsp; Reset" id="b4"></td>
                        </tr>
                    </table>
                </form>
            </div>
            <div id="ser">
                <div id="d2"><b>Certificate &nbsp; Service</b></div>
                <table id="table2">
                    <tr>
                        <td><label id="l10">Your Choice</label><select id="s1" onchange="cmbchk('#s1','#l10')"><option value="" selected disabled>----- Select Any One -----</option><option value="reg">Registration No.</option><option value="cert">Certificate No.</option><option value="sname">Student Name</option></select><br><label id="ll3"></label></td>
                        <td><label id="l11">Your Choice</label><input type="text" id="t11" placeholder="Select Your Choice" readonly><br><label id="ll4"></label></td>
                        <td><label id="lf">From</label><input type="date" id="from"><label id="lt">To</label><input type="date" id="to"></td>
                    </tr>
                    <tr>
                        <td id="sr" colspan="3"><i class="fa fa-search" hidden></i><input type="button" value=" &nbsp; Search" id="b5"><input type="button" value="&#x21bb;&nbsp; Refresh" id="b6"><input type="button" class="fa" value="&#xf019;&nbsp; Download" id="b7"></td>
                    </tr>
                </table>
                <div id="d3">
                    <div id="d5">
                        <table id="table3">
                            <tr><th id="sn">Sn</th><th>Certificate No</th><th>Registration No</th><th>Date Of Issue</th><th>Student Name</th><th>Father's Name</th><th>Course</th><th>Starting Date</th><th>Ending Date</th><th>Study Centre</th><th colspan="4" style="color: blue;">Action</th><th id="sn1"></th></tr>
                            <tr class="tr1"><td id="sn" data-label="SN">1</td><td data-label="Certificate No">P001</td><td data-label="Registration No">Ord0001</td><td data-label="Date Of Issue">UPI</td><td data-label="Student Name">22-07-2001</td><td data-label="Father's Name">15000</td><td data-label='Course'>hgff</td><td data-label="Starting Date">5000</td><td data-label="Ending Date">20000</td><td data-label="Study Centre" contenteditable="true" id="e">17000</td><td data-label="Update"><i class="fa" id="upd" data-toggle="tooltip" title="Update">&#xf044;</i></td><td data-label="Delete"><i class="fa" id="del" data-toggle="tooltip" title="Delete">&#xf014;</i></td><td data-label="Certificate"><i class="fa" id="cert" data-toggle="tooltip" title="Certificate">&#xf019;</i></td><td data-label="Marksheet"><i class="fa" id="mark" data-toggle="tooltip" title="Marksheet">&#xf019;</i></td><td class="sn"></td></tr>
                        </table>
                    </div>
                </div> 
            </div>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="//cdn.rawgit.com/rainabba/jquery-table2excel/1.1.0/dist/jquery.table2excel.min.js"></script>
    <script>
        sessionStorage.setItem('bcode','BR01');
        var bcode=sessionStorage.getItem('bcode');
        // ====================== Animation ===============================
        $('#b2').click(function(){
            $('#togx').css({'margin-left':'10rem','border-radius':'0 1rem 1rem 0'});
            $('#body').css('margin-left','-100%');
            $('#lf,#lt,.fa-search').show();
        })
        $('#b1').click(function(){
            $('#togx').css({'margin-left':'0rem','border-radius':'1rem 0 0 1rem'});
            $('#body').css('margin-left','0%');
            $('#lf,#lt,.fa-search').hide();
            // $('#d3').html('');
        })
        // --------------------------------------------------------------------
       // ======================== Mandatory ===========================
        var flag=true;
        function ch2(t){
            a=$(t).val();
            if(t=='#t7'||t=='#t8'){
                if($('#t7').val()!=''){
                    $('#t8').attr('max',$('#t7').val())
                    if($('#t8').val()!='' && $('#t8').val()<$('#t7').val()){
                        alert("Ending Date Should be greater than Starting Date!")
                        flag=false;
                    }
                }
            }
            else{
                if(a==''||a.length==0){
                    $(t).css({'border':'1px solid red','color':'red'});
                    $(t).val('*Field is Mandotary!');
                    flag=false;
                }
                else if($(t).val()=='*Field is Mandotary!'){
                    flag=false;
                }
            }
            if(t=='#t3' && a.length==18 && a!='*Field is Mandotary!'){
                $.ajax({
                    url:'rays_desk.py',
                    method:'post',
                    data:{
                        cond:'cert_reg',
                        t1:$('#t3').val(),
                        t2:bcode
                    },
                    success:function(data){
                        // alert(data)
                        if(data!='0'){
                            var j=data.split('&&&&')
                            $('#t4').append(j[0])
                            $('#t5').val(j[1])
                            $('#t6').val(j[2])
                            $('#t10').attr('src',j[3])
                            $('#stu,#stur').css('display','block')
                        }
                        else
                            alert('No Record Found!')
                    }
                })
            }
            else{
                if(t=='#t3' && a.length>=1 && a.length<18)
                   $('#ll1').html("Invalid Registration No.")
                   flag=false;
            }
        }
        function ch3(t){
            $(t).css({'border':'1px solid black','color':'black'});
            if($(t).val()=='*Field is Mandotary!')
                $(t).val('')
        }
        //====================Ready Function==============
        $(document).ready(function(){
            auto();
            date();
            $.ajax({
                url:'rays_desk.py',
                method:'post',
                data:{
                    cond:'cert_branch',
                    t1:bcode
                },
                success:function(data){
                    if(data!='0'){
                        $('#t9').val(data+" - "+bcode)
                    }
                    else
                        alert('Something Wrong!')
                }
            })
        })
        var cert_no,cert_ch;
        //=======================auto==============
        function auto(){
            $.ajax({
                url:'rays_desk.py',
                method:'post',
                data:{
                    cond:'cert_auto'
                },
                success:function(data){
                    var j=data.split(',,,');
                    $('#t1').val(j[0]);
                    cert_no=j[1]
                    cert_ch=j[2]
                }
            })
        }
        // -------------------Date-------------
        function date(){
            var dt=new Date()
            dd=dt.getDate()
            mm=dt.getMonth()+1
            yy=dt.getFullYear()
            if(mm<10)
                mm="0"+mm
            if(dd<10)
                dd="0"+dd
            $('#t2,#t7,#t8').val(yy+"-"+mm+"-"+dd)
            $('#t7,#t8').attr({'max':yy+"-"+mm+"-"+dd})
        }
        // -----------------------------------------
        $('#b3').click(function(){
            var conf=confirm("Are you sure want to insert this record?")
            if(conf){
                $.ajax({
                    url:'rays_desk.py',
                    method:'post',
                    data:{
                        cond:'cert_insert',
                        t1:$('#t1').val(),
                        t2:$('#t2').val(),
                        t3:$('#t3').val(),
                        t4:$('#t4 option:selected').text(),
                        t5:$('#t5').val(),
                        t6:$('#t6').val(),
                        t7:$('#t7').val(),
                        t8:$('#t8').val(),
                        t9:$('#t9').val(),
                        t10:'Raj_02',
                        t11:cert_ch,
                        t12:cert_no
                    },
                    success:function(data){
                        var j=data.split(',,,');
                        alert(j[0])
                        if(j[1]==10){
                            auto()
                            clear()
                        }
                    }
                })
            }
        })
        $('#b4').click(function(){
            clear()
        })
        function clear(){
            date()
            $('#t3').val('')
            $('#t4').val(null)
            $('#t5').val('')
            $('#t6').val('')
            $('#stu,#stur').css('display','none')
        }
        // --------------ComboCheck--------------
        function cmbchk(id,l) {
                if ($(id).val() != null){
                    $(l).css('visibility', 'visible')
                    $('#t11').focus()
                    if($(id).val()== 'reg'){
                        $('#t11').removeAttr('readonly')
                        $('#t11').attr({'maxlength':'18','minlength':'18','placeholder':'Registration No.'})
                        $('#t11').css('text-transform','uppercase')
                        $('#l11').html('Registration No.')
                        $('#t11').val('')
                        input('#t11','#l11')
                    }
                    else if($(id).val() == 'cert'){
                        $('#t11').removeAttr('readonly')
                        $('#t11').attr({'maxlength':'18','minlength':'18','placeholder':'Certificate No.'})
                        $('#t11').css('text-transform','uppercase')
                        $('#l11').html('Certificate No.')
                        $('#t11').val('')
                        input('#t11','#l11')
                    }
                    else{
                        $('#t11').removeAttr('readonly','maxlength','minlength')
                        $('#t11').attr({"placeholder":"Student's Name"})
                        $('#t11').css('text-transform','capitalize')
                        $('#l11').html("Student's Name")
                        $('#t11').val('')
                        input('#t11','#l11')
                    }
                }
        }
        //==========================Service Form=============
        $('#b5').click(function(){
            flag2=true;
            if($('#s1').val()!=null){
                ch2('#t11')
                if(!(($('#l11').text()=='Certificate No.' && $('#t11').val().length!=18)||($('#l11').text()=='Registration No.' && $('#t11').val().length!=18)||$('#t13').val()=="*Field is Mandatory!"||$('#t13').val()==null)){
                    if($('#from').val()=='' && $('#to').val()!=''){
                        alert("From Date is required!")
                        flag2=false;
                    }
                    else if($('#from').val()!='' && $('#to').val()==''){
                        alert("To Date is required!")
                        flag2=false;
                    }
                    else{
                        if($('#from').val()>$('#to').val()){
                            alert('From Date Cannot be greater than To Date!')
                            flag2=false;
                        }
                    }
                }
            }
            else{
                flag2=false;
                $('#ll34').html("Please Select Your Choice!")
                $('#s1').css({'color':'red','border':'solid 1px red'})
            }
            if(flag2){
                $.ajax({
                    url:'rays_desk.py',
                    method:'post',
                    data:{
                        cond:'ser_cert',
                        t1:$('#s1').val(),
                        t2:$('#t18').val(),
                        t3:$('#from').val(),
                        t4:$('#to').val()
                    },
                    success:function(data){
                        if(data!=0){
                            $('#d3').html(data);
                            $('#b7').css('display','inline-block');
                        }
                        else{
                            $('#d3').html('');
                            alert("No Record Found!")
                        }
                    }
                })
            } 
        })
        $(document).on('blur','#e',function(){
            // a=$(this).text();
            $(this).text($(this).text()+"   ");
        });
        $(document).on('focus','#e',function(){
            // a=$(this).text().trim();
            $(this).text($(this).text().trim());
        });
        $(document).on('keypress','#e',function(){
            $(this).css('color','green');
        });
        $(document).on('change','#imgi',function(){
            var jk=$(this).closest('td').prev('td').children('img').attr('src')
            image1('#imgi',jk)
        });
        // --------------------Update Data--------------------
        $(document).on('click','#upd',function(){
            var conf=confirm("Are you sure want to Update this Record!");
            if(conf){
                var cell=$(this).closest('tr').children("td").text().split('   ');
                $.ajax({
                    url:'rays_desk.py',
                    method:'post',
                    data:{
                        cond:'upd_int',
                        t1:cell[1],
                        t2:cell[3],
                        t3:cell[6],
                        t4:cell[7],
                        t5:cell[8]
                    },
                    success:function(data){
                        alert(data);
                    }
                })
            }
        })
        // --------------Delete Data------------------
        $(document).on('click','#del',function(){
            var conf=confirm("Are you sure want to Delete this Record!");
            if(conf){
                var cell=$(this).closest('tr').children("td").text().split('   ');
                $.ajax({
                    url:'rays_desk.py',
                    method:'post',
                    data:{
                        cond:'del_int',
                        t1:cell[1]
                    },
                    success:function(data){
                        var j=data.split(',,,')
                        alert(j[0])
                        if(j[1]==10){
                            $(this).closest('tr').text()
                        }
                    }
                })
            }
        })
        // -----------------Refresh Page------------
        $('#b6').click(function(){
            $('#s1').val(null);
            $('#d3').html('');
            $('#b7').css('display','none')
            $('#t18').val('')
            $('#from').val('')
            $('#to').val('')
            input('#t18','#l18')
            $('#t18').attr({'placeholder':'Select Your Choice','readonly':true})
            $('#ll34').html('')
            $('#l18').css('visibility','hidden')
        })
        // ======================= Download==========================
        
        $(document).on('click','#b7',function(){
            var conf=confirm("Do you want to Download this record!")
            if(conf){
                $("#table3").table2excel({
                    exclude: ".sn,#sn,#chk,#del,#upd,#mark,#cert",
                    filename: $('#s1').val()+"_exp.xls"
                });
            }
        });
    </script>
</body>
</html>
