<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admission Form</title>

    <style>
        html{
            font-size: 10px;
        }
        body{
            margin: 0;
            overflow-x: hidden;
        }
        #main{
            width: 100%;
            height: auto;
            overflow-x: hidden;
        }
        #d1{
            height: 7rem;
            background-color: rgb(77, 169, 244);
        }
        #hm{
            height: 7rem;
            width: auto;
            display: flex;
            align-items: center;
            float: left;
        }
        #d1 a{
            text-decoration: none;
            margin:3rem;
        }
        #tog{
            margin: 1.5rem 3rem;
            height: 4rem;

            display: flex;
            float: right;
        }
        #togx{
            position: absolute;
            height: 4rem;
            width: 10rem;
            background-color: white;
            transition: .3s;
            /* margin-left: 10rem; */
            border-radius: 1rem 0 0 1rem;
            /* box-shadow: 2px 2px 10px rgb(249, 65, 237); */
        }
        #tog p{
            margin: 0;
            position: relative;
            height: 100%;
            width: 50%;
            cursor: pointer;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            font-size: 2rem;
        }
        #b1{
            border-radius: 1rem 0 0 1rem;
        }
        #b2{
            border-radius:0 1rem 1rem 0;
        }
        #body{
            width: 200%;
            transition: .5s;
        }
        #ent,#ser{
            height: auto;
            width: 50%;
            float: left;
        }
        #d2{
            background-color: rgb(179, 229, 243);
            display: flex;
            height: 5rem;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        #table1,#table2{
            width: 95%;
            margin: 3rem 2.5%;
            border-collapse:collapse;
        }
        #table1 td,#table2 td{
            height: 8rem;
            text-align: center;
        }
        #table1 #td1{
            width: 43%;
        }
        #table1 #td2{
            width: 14%;
        }
        select{
            height: 4.5rem;
            width:91%;
            font-size: 1.8rem;
            text-align: center;
        }
        #t1,#t2,#t3,#t4,#t6,#t5,#t7,#t8,#t10,#t9,#from,#to,#t11,#t12,#t13{
            width: 90%;
            height: 4rem;
            padding-left: 1rem;
            font-size: 1.8rem;
        }
        #from,#to{
            width: 41%;
            font-size: 1.5rem;
        }
        #to{
            margin-left: 5%;
        }
        #t7,#t6{
            width: 42.5%;
            font-size: 1.5rem;
        }
        #t7{
            margin-left: 5%;
        }
        #t9,#t10,#t11{
            width: 25.5%;
            font-size: 1.5rem;
        }
        #t11,#t10{
            margin-left: 5%;
        }
        #l1,#l2,#l3,#l4,#l5,#l6,#l7,#l8,#l10,#l9,#l11,#l12,#lf,#lt,#l13,#l14{
            position: absolute;
            font-size: 1.8rem;
            margin: -1rem 4rem;
            background-color: white;
        }
        #l3,#l4,#l5,#l6,#l7,#l14,#l13{
            visibility: hidden;
        }
        #lt{
            margin-left: 3%;
        }
        #ll1,#ll2,#ll3,#ll4,#ll5,#ll6,#dtl{
            color: red;
            font-size: 1.6rem;
            float:left;
            margin-left: 3rem;
        }
        #ll4{
            margin-left: 30%;
        }
        #b3,#b4,#b5,#b6,#b7{
            font-weight: bolder;
            font-size: 1.7rem;
            height: 4rem;
            width: 13rem;
            border-radius: 1rem;
            cursor: pointer;
            background-color: green;
            color: white;
        }
        /* #d4{
            text-align: right;
        } */
        #b7{
            background:blue;
            margin-left: 7rem;
            display: none;
        }
        .fa-search{
            position: absolute;
            font-size: 1.7rem;
            color:white;
            margin: 1.2rem 1.5%;
        }
        #b4,#b6{
            background: red;
            margin-left: 7rem;
        }
        /* #b5{
            margin-left: 20%;
        } */
        /* ------------ Service ----------------- */
        #table2 td{
            width: 33%;
        }
        #table2 #sr{
            text-align: center;
        }
        #d5{
            height: 30rem;
            overflow-y: auto;
            margin-top: 3rem;
        }
        #table3{
            width: 90%;
            margin-left: 5%;
            text-align: center;
            font-size: 1.8rem;
            border-collapse:collapse;
        }
        #table3 .tr1:hover{
            background-color: rgb(167, 167, 247);
            color: white;
        }
        #del{
            color: red;
            font-weight: bold;
        }
        #upd{
            color: black;
            font-weight: bold;
        }
        #prt{
            color: rgb(4, 32, 83);
            font-weight: bold;
        }
        #del:hover,#upd:hover,#prt:hover{
            cursor: pointer;
            scale: 1.5;
            transition: .3s;

        }
        #table3 th,#table3 td{
            height: 3rem;
            border: .1rem solid black;
        }
        #table3 th{
            position: sticky;
            top: 0;
            background-color:antiquewhite;
        }
       #table3 .sn{
            display: none;
        }
        #table3 input{
            border: none;
            outline: none;
        }
        #sa1{
            height: 100%;
            width: 100%;
            border: none;
            outline: none;
        }
        /* #table3 tr:nth-child(odd){
            background-color: rgb(184, 182, 182);
        } */
        @media (max-width:998px) {
            html{
                font-size: 55%;
            }
        }
        @media (max-width:768px) {

            html{
                font-size: 45%;
            }
            #table1 #td1{
                width: 100%;
            }
            #table1 #td2{
                display: none;
            }
            #table3 th{
                display: none;
            }
            #table1 td,#table2 td,#table3 td{
                display: block;
            }
            #table2 td{
                width: 100%;
            }
            #lt{
                margin-left: 9%;
            }
            /* #d4{
                display: flex;
                flex-wrap:wrap;
                justify-content: space-around;
                margin-left: 2rem;
            } */
            #b5{
                margin-left: 0;
            }
            #table2 #sr{
                text-align: center;
            }
            .fa-search{
                margin: 1rem 2rem;
            }
            #d5{
                height: auto;
            }
            #table3 .sn{
                display: block;
                background-color: antiquewhite;
            }
            #table3 td{
                text-align: right;
            }
            #table3 td::before {
                content: attr(data-label);
                float: left;
                font-weight: bold;
                color: black;
            }
            #sa1{
                width: 50%;
            }
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="d1">
                <div id="hm"><a href="dashbord.html" id="home"><font size="5rem" style="color: white;">&#x1F3E0; &nbsp; HOME</font></a></div>
                <div id="tog"><div id="togx"></div><p id="b1"><b>Entry</b></p><p id="b2"><b>Service</b></p></div>

        <div id="body">
            <div id="ent">
                <div id="d2"><b>Admission &nbsp; Entry</b></div>
                <form>
                    <table id="table1">
                        <tr>
                            <td id="td1"><label id="l1">Adm. Form No.</label><input type="text" id="t1" placeholder="Adm. Form No." readonly></td>
                            <td id="td1"><label id="l2">Adm. Date</label><input type="date" id="t2" placeholder="Adm. Date" onchange="dtchk()" readonly><br><label id="dtl"></label></td>

                        <tr>
                            <td><label id="l3">Registration No.</label><input type="text" id="t3" placeholder="Registration No." oninput="input('#t3','#l3')" maxlength="18" minlength="18" onkeydown="keychk('#t3','#ll1')" onfocusout="ch2('#t3')" onfocus="ch3('#t3')" style="text-transform: uppercase;"><br><label id="ll1" class="l"></label></td>
                            <td><label id="l4">Prev. Course</label><input type="text" id="t4" placeholder="Prev. Course" readonly></td>

                        <tr>
                            <td><label id="l5">Student Name</label><input type="text" id="t5" placeholder="Student Name" readonly></td>
                        </tr>
                        <tr>
                            <td><label id="l6">Course Applying</label><select style="height: 4.5rem;" id="t6" onfocus="ch3('#t6')" onfocusout="ch2('#t6')" onchange="cmbchk('#t6','#l6')"><option value="" selected>----- Select Any Course -----</option></select><label id="l7">Selected Course</label><input type="text" placeholder="Selected Course" id="t7" readonly><br><label id="ll2"></label></td>

                </form>
            </div>
            <div id="ser">
                <div id="d2"><b>Admission &nbsp; Service</b></div>
                <table id="table2">
                    <tr>
                        <td><label id="l13">Your Choice</label>
                            <select id="s1" onchange="cmbchk('#s1','#l13')" onfocus="ch3('#s1')">
                                <option value="" selected disabled>----- Select Your Choice -----</option>
                                <option value="reg">Registration No.</option>
                                <option value="adm">Admission No.</option>
                                <option value="sname">Student's Name</option>

                            <br><label id="ll5"></label>
                        </td>
                        <td><label id="l14">Your Choice</label>
                            <input type="text" id="t13" placeholder="Select Your Choice" onfocus="ch3('#t13')" onfocusout="ch2('#t13')" readonly>
                            <br><label id="ll6" class="l"></label></td>
                        <td><label id="lf">From</label><input type="date" id="from"><label id="lt">To</label><input type="date" id="to"></td>
                    </tr>
                    <tr>
                        <td id="sr" colspan="3" ><i class="fa fa-search" hidden></i><input type="button" value=" &nbsp; Search" id="b5"><input type="button" value="&#x21bb;&nbsp; Refresh" id="b6"><input type="button" class="fa" value="&#xf019;&nbsp; Download" id="b7"></td>

                <div id="d3">
                    <!-- <div id="d5">
                        <table id="table3">
                            <tr><th id="sn">Sn</th><th>Admission No</th><th>Admission Date</th><th>Registration No</th><th>Course Applied</th><th>Course Fee</th><th>Discount</th><th colspan="3" id="chk">Check</th></tr>
                            <tr class="tr1"><td id="sn" data-label="SN">1</td><td data-label="Admission No">P001</td><td data-label="Admission Date">Ord0001</td><td data-label="Registration No">UPI</td><td data-label="Course Applied" contenteditable="true" id="e">22-07-2001</td><td data-label="Course Fee">15000</td><td data-label="Discount" contenteditable="true" id="e">5000</td><td data-label="Update"><i class="fa" id="upd" data-toggle="tooltip" title="Update">&#xf044;</i></td><td data-label="Delete"><i class="fa" id="del" data-toggle="tooltip" title="Delete">&#xf014;</i></td><td data-label="Print" aria-disabled="true"><i class="fa" id="prt" data-toggle="tooltip" title="Print" aria-readonly="true">&#xf02f;</i></td></tr>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="//cdn.rawgit.com/rainabba/jquery-table2excel/1.1.0/dist/jquery.table2excel.min.js"></script>
    <script>
        var bcode=sessionStorage.getItem('bcode');
        // ====================== Animation ===============================
        $('#b2').click(function(){
            $('#togx').css({'margin-left':'10rem','border-radius':'0 1rem 1rem 0'});
            $('#body').css('margin-left','-100%');
            $('#lf,#lt,.fa-search').show();
        })
        $('#b1').click(function(){
            $('#togx').css({'margin-left':'0rem','border-radius':'1rem 0 0 1rem'});
            $('#body').css('margin-left','0%');
            $('#lf,#lt,.fa-search').hide();
            // $('#d3').html('');
        })
        // --------------------------------------------------------------------
       // ======================== Mandatory ===========================
       var flag =flag2= true;
        function ch2(t) {
            a = $(t).val();
            $('.l').html('')
            if(t=='#t6'){
                if($('#t7').val().length==0){
                    flag=false
                    $('#ll2').text('Please Select AnyOne!')
                    $(t).css({ 'border': '1px solid red', 'color': 'red' });
                }
            }
            else{
                if (a == null || a == '' || a.length == 0) {
                    $(t).css({ 'border': '1px solid red', 'color': 'red' });
                    $(t).val('*Field is Mandatory!');
                    flag = false;
                    if(t=='#t13')
                        flag2 = false;
                }
                else if($(t).val().trim()== '*Field is Mandatory!'){
                    flag = false;
                    if(t=='#t13')
                        flag2 = false;
                }
            }
            if(t=='#t3' && a.length==18){
                $.ajax({
                        url: 'rays_desk.py',
                        method: 'post',
                        data: {
                            cond: 'adm_reg',
                            t1: $('#t3').val(),
                            t2:bcode
                        },
                        success: function (data) {
                            if(data!=0){
                               var j=data.split(',,,')
                               $('#t4').val(j[1])
                               $('#t5').val(j[0])
                               input('#t4','#l4')
                               input('#t5','#l5')
                            }
                            else
                               alert("No Record Found for this Input, try Again!")
                        }
                })
            }
            else if(a.length>1 && a.length<18){
                $('#ll1').html("Invalid Registration No!")
                flag=false;
            }
            if(t=='#t13' && $('#l14').text()=='Registration No.' && a.length>=1 && a.length<18){
                $('#ll6').html("Invalid Registration No!")
                flag2=false;
            }
            else if(t=='#t13' && $('#l14').text()=='Admission No.' && a.length>=1 && a.length<7){
                $('#ll6').html("Invalid Admission No!")
                flag2=false;
            }
        }
        function ch3(t) {
            $(t).css({ 'border': '1px solid black', 'color': 'black' });
            if(t=='#s1'){
                $('#ll5').html('')
            }
            else if(t=='#t6'){
                $('#ll2').text('')
            }
            else{
                if ($(t).val().trim()== '*Field is Mandatory!' || $(t).val() == null) {
                    $(t).val('')
                }
            }
        }
        // ====================Key Validaition=================
        var jkl=0;
        $('#t13').keypress(function(a){
            if (jkl==1) {
                    if((a.which == 47||a.which>=48 && a.which<=57)&& a.target.selectionStart === 0){
                        $('#ll6').text("Digit & / at First Not Allowed!");
                        return false;
                    }
                    else if(!(a.which>=48 && a.which<=57 || a.which>=65 && a.which<=90 || a.which>=97 && a.which<=122 || a.which==13||a.which==47)){
                        $('#ll6').text("Only Alphabet,Digit & / Allowed!");
                        return false;
                    }
                    else if(a.which==47 && $('#t13').val().slice(-1) ==='/'){
                        $('#ll6').text("'/' Multiple times Not Allowed!");
                        a.preventDefault();
                    }
                    else
                        $('#ll6').text("");
            }
            else if(jkl==2){
                    if((a.which == 48||a.which>=65 && a.which<=90 || a.which>=97 && a.which<=122)&& a.target.selectionStart === 0){
                        $('#ll6').text("Alphabet & Zero at First Not Allowed!");
                        return false;
                    }
                    else if(!(a.which>=48 && a.which<=57 || a.which>=65 && a.which<=90 || a.which>=97 && a.which<=122 || a.which==13)){
                        $('#ll6').text("Only Alphabet,Digit Allowed!");
                        return false;
                    }
                    else
                        $('#ll6').text("");
            }
            else if(jkl==3){
                    if((a.which == 46||a.which==32) && a.target.selectionStart === 0){
                        $('#ll6').text("Dot & Space at First Not Allowed!");
                        return false;
                    }
                    else if(!(a.which>=65 && a.which<=90 || a.which>=97 && a.which<=122 || a.which==13||a.which==46||a.which==32)){
                        $('#ll6').text("Only Alphabet,Digit & / Allowed!");
                        return false;
                    }
                    else if((a.which==46 || a.which==32)&& $('#t13').val().slice(-1) ===String.fromCharCode(a.which)){
                        $('#ll6').text("Dot & Space Multiple times Not Allowed!");
                        a.preventDefault();
                    }
                    else
                        $('#ll6').text("");
            }
        })
        function keychk(chk, d) {
            $(d).text("");
            if (chk=='#t3') {
                $(chk).on('keypress', function (a) {
                    if((a.which == 47||a.which>=48 && a.which<=57)&& a.target.selectionStart === 0){
                        $(d).text("Digit & / at First Not Allowed!");
                        return false;
                    }
                    else if(!(a.which>=48 && a.which<=57 || a.which>=65 && a.which<=90 || a.which>=97 && a.which<=122 || a.which==13||a.which==47)){
                        $(d).text("Only Alphabet,Digit & / Allowed!");
                        return false;
                    }
                    else if(a.which==47 && $(this).val().slice(-1) ==='/'){
                        $(d).text("'/' Multiple times Not Allowed!");
                        a.preventDefault();
                    }
                    else
                        $(d).text("");
                });
            }
            else if(chk=='#t9' && $('#t8').val()!=0||chk=='#t10' && $('#t8').val()!=0){
                $(chk).on('keypress',function(a){
                    if(a.which == 48 && a.target.selectionStart === 0){
                        $(d).text("Zero at First Not Allowed!");
                        return false;
                    }
                    else if(!(a.which>=48 && a.which<=57 || a.which==13)){
                        $(d).html('Only Digit Allowed!');
                        return false;
                    }
                    else if($(this).val()=='0')
                        $(this).val('');
                    else
                        $(d).text("");
                    if(chk=='#t10'){
                        bk=$('#t8').val()
                        if(bk=='')
                            bk=0
                        if(parseInt($(this).val()+String.fromCharCode(a.which))>parseInt(bk)){
                            $(d).text("Discount can't be greater than Course fee!");
                            return false;
                        }
                    }
                })
            }
        }
        $('#t9,#t10').on('input',function(){
            var nk;
            if($(this).val()=='')
                nk=0
            else
                nk=$(this).val()
            if($(this).attr('id')=='t10'){
                $('#t12').val(parseFloat($('#t8').val())-parseFloat(nk))
                $('#t9').val((nk/$('#t8').val()*100).toFixed(2))
            }
            else{
                $('#t12').val(parseFloat($('#t8').val())-parseFloat(nk*$('#t8').val()/100))
                $('#t10').val(nk*$('#t8').val()/100)
            }
        })
        $('#t10,#t9').keyup(function(){
            if($(this).val()=='')
                $(this).val('0');
        })
        $('#t10,#t9').focusout(function(){
            if($(this).attr('id')=='t10')
                $('#ll4').html('');
            else if($(this).attr('id')=='t9')
                $('#ll3').html('');
        })
        // -----------------Legend------------------------
        function input(d, l) {
            jk = $(d).val()
            if (jk != '') {
                $(l).css('visibility', 'visible')
            }
            else {
                $(l).css('visibility', 'hidden')
            }
        }
         // --------------ComboCheck--------------
         function cmbchk(id,l) {
            if(id=='#t6'){
                if ($(id).val() != null){
                    $(l).css('visibility', 'visible')
                    input('#t7','#l7')
                    if($('#t7').val()!=''){
                        $('#t7').val($('#t7').val()+","+$(id).val())
                    }
                    else{
                        $('#t7').val($(id).val())
                    }
                    $.ajax({
                        url: 'rays_desk.py',
                        method: 'post',
                        data: {
                            cond: 'adm_cfee',
                            t1: $(id).val(),
                            t2:bcode
                        },
                        success: function (data) {
                            if(data!=0){
                                $('#t8').val(parseInt($('#t8').val())+parseInt(data))
                                $('#t12').val(parseInt($('#t8').val()))
                                $('#t6 option[value!=null]:selected').detach()
                                $('#t9,#t10').removeAttr('readonly')
                            }
                            else
                                alert("Something Went Wrong!")
                        }
                    })
                }
            }
            else if(id=='#t11'){
                if($(id).val()!='inst' && $('#t7').val()!=''){
                    $.ajax({
                        url: 'rays_desk.py',
                        method: 'post',
                        data: {
                            cond: 'adm_otp',
                            t1: $('#t7').val(),
                            t2:bcode
                        },
                        success: function (data) {
                            $('#t10').val(data)
                            $('#t12').val(parseFloat($('#t8').val())-parseFloat(data))
                            $('#t9').val((parseInt(data)/$('#t8').val()*100).toFixed(2))
                        }
                    })
                }
                else
                    $('#t10').val('0') 
            }
            else if(id=='#s1'){
                if ($(id).val()!= null){
                    $(l).css('visibility', 'visible')
                    $('#t13').focus()
                    if($(id).val()== 'reg'){
                        $('#t13').removeAttr('readonly')
                        $('#t13').attr({'maxlength':'18','minlength':'18','placeholder':'Registration No.'})
                        $('#t13').css('text-transform','uppercase')
                        $('#l14').html('Registration No.')
                        $('#t13').val('')
                        $('#ll5').html('')
                        jkl=1
                    }
                    else if($(id).val() == 'adm'){
                        $('#t13').removeAttr('readonly')
                        $('#t13').attr({'maxlength':'7','minlength':'7','placeholder':'Admission No.'})
                        $('#t13').css('text-transform','uppercase')
                        $('#l14').html('Admission No.')
                        $('#t13').val('')
                        $('#ll5').html('')
                        jkl=2
                    }
                    else{
                        $('#t13').removeAttr('readonly')
                        $('#t13').attr({"placeholder":"Student's Name",'maxlength':'','minlength':''})
                        $('#t13').css('text-transform','capitalize')

        var cd;
        function date() {
            var b = new Date();
            yy = b.getFullYear()
            dd = b.getDate()
            mm = b.getMonth() + 1
            if (mm < 10)
                mm = "0" + mm
            if (dd < 10)
                dd = "0" + dd
            cd=yy + '-' + mm + '-' + dd
            $('#from,#to').attr('max',cd)
            $('#t2').attr({'value':cd,'max':cd})
        }
        function dtchk(){
            if($('#t2').val()==''){
                flag=false;
                $('#dtl').text("Date Cann't be empty!")
            }
            else if($('#t2').val()>cd){

                $('#dtl').text("Date Cann't be grater than Current Date!")
            }
            else
                $('#dtl').text("")
        }
