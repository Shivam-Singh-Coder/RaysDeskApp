<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Remainder Form</title>
    <link rel="icon" href="repllogo.png">
    <style>
        html{
            font-size: 10px;
        }
        body{
            margin: 0;
        }
        #d1{
            height: 7rem;
            background-color: rgb(77, 169, 244);
        }
        #hm{
            height: 7rem;
            width: auto;
            display: flex;
            align-items: center;
            float: left;
        }
        #d1 a{
            text-decoration: none;
            margin:3rem;
        }
        #body{
            width: 100%;
            transition: .5s;
        }
        #d2{
            background-color: rgb(179, 229, 243);
            display: flex;
            height: 5rem;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        #d31{
            margin: -2rem 0 2rem;
            font-size: 3rem;
            text-decoration: underline;  
        }
       #table2{
            width: 95%;
            margin: 3rem 2.5%;
            border-collapse:collapse;
        }
        #table2 td{
            height: 8rem;
            text-align: center;
        }
        select{
            height: 4.5rem;
            width:91%;
            font-size: 1.8rem;
            text-align: center;
        }
        #from,#to{
            width: 41%;
            height: 4rem;
            padding-left: 1rem;
            font-size: 1.8rem;
            font-size: 1.5rem;
        }
        #to{
            margin-left: 5%;
        }
        #t11,#t1{
            width: 42.5%;
            font-size: 1.5rem;
        }
        #lf,#lt{
            position: absolute;
            font-size: 1.8rem;
            margin: -1rem 4rem;
            background-color: white;
        }
        #lt{
            margin-left: 8%;
        }
        #b5,#b6{
            font-weight: bolder;
            font-size: 1.7rem;
            height: 4rem;
            width: 13rem;
            border-radius: 1rem;
            cursor: pointer;
            background-color: green;
            color: white;
        }
        .fa-search{
            position: absolute;
            font-size: 1.7rem;
            color:white;
            margin: 1rem 2rem;
        }
        #b6{
            background: red;
            margin-left: 7rem;
        }
        /* ------------ Service ----------------- */
        #table2 td{
            width: 33%;
        }
        #table2 #sr{
            text-align: center;
        }
        #d5{
            height: 24rem;
            overflow-y: auto;
            margin-top: 3rem;
        }
        #table3{
            width: 90%;
            margin-left: 5%;
            text-align: center;
            font-size: 1.8rem;
            border-collapse:collapse;
        }
        #table3 th,#table3 td{
            height: 3rem;
            border: .1rem solid black;
        }
        #table3 th{
            position: sticky;
            top: 0;
            background-color:antiquewhite;
        }
        /* #table3 #sn,#table3 .sn{
            display: none;
        } */
        #table3 input{
            border: none;
            outline: none;
        }
        #table3 tr:nth-child(odd){
            background-color: rgb(184, 182, 182);
        }
        @media (max-width:998px) {
            html{
                font-size: 55%;
            }
        }
        @media (max-width:768px) {

            html{
                font-size: 45%;
            }
            #table1 #td1{
                width: 100%;
            }
            #table1 #td2{
                display: none;
            }
            #table3 th{
                display: none;
            }
            #table1 td,#table2 td,#table3 td{
                display: block;
            }
            #table2 td{
                width: 100%;
            }
            #lt{
                margin-left: 9%;
            }
            #d4{
                display: flex;
                flex-wrap:wrap;
                justify-content: space-around;
            }
            #b5{
                margin-left: 0;
            }
            #table2 #sr{
                text-align: center;
            }
            .fa-search{
                margin: 1rem 2rem;
            }
            #d5{
                height: auto;
            }
            /* #table3 .sn{
                display: block;
                background-color: antiquewhite;
            } */
            #table3 td{
                text-align: right;
            }
            #table3 td::before {
                content: attr(data-label);
                float: left;
                font-weight: bold;
                color: black;
            }
        }
    </style>
</head>
<body>
    <div id="main">
        <div id="d1">
                <div id="hm"><a href="#" id="home"><font size="4rem">&#x1F3E0; &nbsp; HOME</font></a></div>
        </div>
        <div id="body">
            <div id="ser">
                <div id="d2"><b>Remainder &nbsp; Form</b></div>
                <table id="table2">
                    <caption id="d31"><b>Installment &nbsp; Date</b></caption>
                    <tr>
                        <td><label id="lf">From</label><input type="date" id="from"><label id="lt">To</label><input type="date" id="to"></td>
                    </tr>
                    <tr>
                        <td id="sr"><i class="fa fa-search" hidden></i><input type="button" value=" &nbsp; Search" id="b5"><input type="button" value="&#x21bb;&nbsp; Refresh" id="b6"></td>
                    </tr>
                </table>
                <div id="d3">
                    <div id="d5">
                        <table id="table3">
                            <tr><th id="sn">Sn</th><th>Admission No</th><th>Student Name</th><th>Contact No</th><th>Course Name</th><th>Total Fee</th><th>Total_Amt_Paid</th><th>Dues Amt</th><th>Ins_Date</th></tr>
                            <tr><td id="sn" data-label="SN">1</td><td data-label="Admission No">P001</td><td data-label="Student Name">Ord0001</td><td data-label="Contact No">Ord0001</td><td data-label="Course Name">UPI</td><td data-label="Total Fee">22-07-2001</td><td data-label="Total_Amt_Paid">15000</td><td data-label="Dues Amt">5000</td><td data-label="Ins_Date">20000</td></tr>
                            <tr><td id="sn" data-label="SN">2</td><td data-label="Admission No">P001</td><td data-label="Student Name">Ord0001</td><td data-label="Contact No">Ord0001</td><td data-label="Course Name">UPI</td><td data-label="Total Fee">22-07-2001</td><td data-label="Total_Amt_Paid">15000</td><td data-label="Dues Amt">5000</td><td data-label="Ins_Date">20000</td></tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script>
        sessionStorage.setItem('bcode','BR01');
        var bcode=sessionStorage.getItem('bcode');
        // --------------------------------------------------------------------
       // ======================== Mandatory ===========================
        var flag=true;
        function ch2(t,l){
            a=$(t).val();
            if(a==null){
                $(t).css('border','2px solid red');
                $(l).html('Select any One!');
                flag=false;
            }
        }
        function ch3(t,l){
            $(t).css('border','1px solid black');
            $(l).html('');
        }
    </script>
</body>
</html>
