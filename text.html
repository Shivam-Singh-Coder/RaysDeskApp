<html>
  <head>
    <style>
      iframe{
        width:100%;
        height: 100%;
        border: solid 2px black;
      }
    </style>
  </head>
  <body>
    <input type="file" name="" id="">
    <iframe src="" frameborder="0"></iframe>
    <script>
      document.querySelector('input').addEventListener("change", function(e){
        var file = e.target.files[0];
        if (file) {
          // create a blob url for the image to display in the iframe
          var imgURL = window.URL.createObjectURL(file);
          console.log(imgURL);
          // set the source of the iframe to be this new URL
          document.querySelector('iframe').src = imgURL;
        }
        else
          document.querySelector('iframe').src = '';
      });
    </script>
  </body>
</html>
