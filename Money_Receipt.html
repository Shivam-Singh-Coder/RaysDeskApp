<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Money_Receipt</title>
    <style>
        html {
            font-size: 10px;
        }

        body {
            margin: 0;
            overflow-x: hidden;
        }

        #main {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
        }

        #d1 {
            height: 7rem;
            background-color: rgb(77, 169, 244);
        }

        #hm {
            height: 7rem;
            width: auto;
            display: flex;
            align-items: center;
            float: left;
        }

        #d1 a {
            text-decoration: none;
            margin: 3rem;
        }

        #tog {
            margin: 1.5rem 3rem;
            height: 4rem;
            width: 20rem;
            display: flex;
            float: right;
        }

        #togx {
            position: absolute;
            height: 4rem;
            width: 10rem;
            background-color: white;
            transition: .3s;
            border-radius: 1rem 0 0 1rem;
        }

        #tog p {
            margin: 0;
            position: relative;
            height: 100%;
            width: 50%;
            cursor: pointer;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid black;
            font-size: 2rem;
        }

        #b1 {
            border-radius: 1rem 0 0 1rem;
        }

        #b2 {
            border-radius: 0 1rem 1rem 0;
        }

        #body {
            width: 200%;
            transition: .5s;
        }

        #ent,
        #ser {
            height: auto;
            width: 50%;
            float: left;
        }

        #d2 {
            background-color: rgb(179, 229, 243);
            display: flex;
            height: 5.2rem;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        #table1,
        #table2 {
            width: 95%;
            margin: 1rem 2.5%;
            border-collapse: collapse;
        }

        #table1 td,
        #table2 td {
            height: 5.5rem;
            text-align: center;
        }

        #table1 #td1 {
            width: 43%;
        }

        #table1 #td2 {
            width: 14%;
        }

        select {
            height: 4.5rem;
            width: 91%;
            font-size: 1.8rem;
            text-align: center;
        }

        #t1,
        #t2,
        #t3,
        #t4,
        #t5,
        #t6,
        #t7,
        #t8,
        #t9,
        #t10,
        #t11,
        #t16,
        #t17,
        #t18,
        #from,
        #to {
            width: 90%;
            height: 3rem;
            padding-left: 1rem;
            font-size: 1.5rem;
        }

        #from,
        #to {
            width: 41%;
            font-size: 1.5rem;
        }

        #to {
            margin-left: 5%;
        }

        #t11,
        #t12,
        #t13 {
            width: 42.5%;
            font-size: 1.5rem;
        }

        #t11 {
            margin-left: 4%;
        }

        #l1,
        #l2,
        #l3,
        #l4,
        #l5,
        #l6,
        #l7,
        #l8,
        #l9,
        #l10,
        #l12,
        #l13,
        #l14,
        #l15,
        #l16,
        #l17,
        #l18,
        #lf,
        #lt {
            position: absolute;
            font-size: 1.8rem;
            margin: -1rem 4rem;
            background-color: white;
        }

        #lt {
            margin-left: 3%;
        }

        #ll5,
        #ll2,
        #ll1 {
            color: red;
            font-size: 1.6rem;
        }

        #b3,
        #b4,
        #b5,
        #b6,
        #b7,
        #b8,
        #b9 {
            font-weight: bolder;
            font-size: 1.7rem;
            height: 4rem;
            width: 13rem;
            border-radius: 1rem;
            cursor: pointer;
            background-color: green;
            color: white;
        }

        #b7,
        #b8,
        #b9 {
            margin-right: 3rem;
        }

        .fa-search {
            position: absolute;
            font-size: 1.7rem;
            color: white;
            margin: 1rem 14%;
        }

        #b4,
        #b6 {
            background: red;
            margin-left: 7rem;
        }

        #b5 {
            margin-left: 20%;
        }

        /* ------------ Service ----------------- */
        #table2 td {
            width: 33%;
        }

        #table2 #sr {
            text-align: left;
        }

        #d5 {
            height: 30rem;
            overflow-y: auto;
            margin-top: 3rem;
        }

        #table3 {
            width: 90%;
            margin-left: 5%;
            text-align: center;
            font-size: 1.8rem;
            border-collapse: collapse;
        }

        #table3 th,
        #table3 td {
            height: 3rem;
            border: .1rem solid black;
        }

        #table3 th {
            position: sticky;
            top: 0;
            background-color: antiquewhite;
        }

        #table3 #sn,
        #table3 .sn {
            display: none;
        }

        #table3 input {
            border: none;
            outline: none;
        }

        #sa1 {
            height: 100%;
            width: 100%;
            border: none;
            outline: none;
        }

        #del,
        #upd,
        #prt {
            font-size: 2rem;
        }

        #del {
            color: red;
            font-weight: bold;
        }

        #upd {
            color: black;
            font-weight: bold;
        }

        #prt {
            color: rgb(4, 32, 83);
            font-weight: bold;
        }

        #del:hover,
        #upd:hover,
        #prt:hover {
            cursor: pointer;
            scale: 1.5;
            transition: .3s;

        }

        font {
            color: red;
        }

        #p {
            font-size: 2rem;
        }

        .cas,
        .che,
        .upi,
        .dd {
            width: 9rem;
            height: 2.5rem;

        }

        .a,
        .b,
        .c,
        .d {
            font-size: 1.5rem;
        }

        @media (max-width:998px) {
            html {
                font-size: 55%;
            }
        }

        @media (max-width:768px) {

            html {
                font-size: 45%;
            }

            #table1 #td1 {
                width: 100%;
            }

            #table1 #td2 {
                display: none;
            }

            #table3 th {
                display: none;
            }

            #table1 td,
            #table2 td,
            #table3 td {
                display: block;
            }

            #table2 td {
                width: 100%;
            }

            #lt {
                margin-left: 9%;
            }

            #d4 {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-around;
            }

            #b5 {
                margin-left: 0;
            }

            #table2 #sr {
                text-align: center;
            }

            .fa-search {
                margin: 1rem 2rem;
            }

            #d5 {
                height: auto;
            }

            #table3 .sn {
                display: block;
                background-color: antiquewhite;
            }

            #table3 td {
                text-align: right;
            }

            #table3 td::before {
                content: attr(data-label);
                float: left;
                font-weight: bold;
                color: black;
            }

            #sa1 {
                width: 50%;
            }

            #table1 #tdd {
                height: 10rem;
            }
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="d1">
            <div id="hm"><a href="#" id="home">
                    <font size="4rem">&#x1F3E0; &nbsp; HOME</font>
                </a></div>
            <div id="tog">
                <div id="togx"></div>
                <p id="b1"><b>Entry</b></p>
                <p id="b2"><b>Service</b></p>
            </div>
        </div>
        <div id="body">
            <div id="ent">
                <div id="d2"><b>MONEY_RECEIPT</b></div>
                <form>
                    <table id="table1">
                        <tr>
                            <td id="td1"><label id="l1">Receipt No</label><input type="text" id="t1"
                                    placeholder="receipt No"></td>
                            <td id="td1"><label id="l2">Date</label><input type="date" id="t2" placeholder=" Date"></td>

                        </tr>
                        <tr>
                            <td id="td1"><label id="l3">Admission_Form No <font>*</font></label><input type="text"
                                    id="t3" placeholder="Admission_Form No" onfocus="fgchk('#t3')"
                                    onfocusout="flchk('#t3')">
                                <br><label id="ll5"></label>
                            </td>
                            <td id="td1"><label id="l4">Course Applied</label><input type="text" id="t4"
                                    placeholder="Course Applied"></td>

                        </tr>
                        <tr>
                            <td><label id="l5">Name </label><input type="text" id="t5" placeholder="Name"></td>
                            <td><label id="l6">Pre Dues Amount</label><input type="text" id="t6"
                                    placeholder="Pre Dues Amount"></td>
                        </tr>
                        <tr>
                            <td><label id="l7">Fee </label><input type="text" id="t7" placeholder="Fee"
                                    oninput="lag('#t7','#l7')"><br><label id="ll7"></label></td>
                            <td><label id="l8">Discount</label><input type="text" id="t8" placeholder="Discount"></td>
                        </tr>
                        <tr>
                            <td id="td1"><label id="l9">Payable/Amount</label><input type="text" id="t9"
                                    placeholder="Payable/Amount"></td>
                            <td id="td1"><label id="l10">Installment Date <font>*</font></label><input type="date"
                                    id="t10" placeholder="Installment Date"></td>
                        </tr>
                        <tr>
                            <td id="tdd"> <label id="p"> Payment modes <font>*</font></label>
                                <div style="display: flex;flex-wrap: wrap;justify-content: space-around;width:96%;">
                                    <label class="a" style="padding-left: 2rem;">Cash</label><input type="text"
                                        placeholder="cash" value="0" class="cas" onfocus="fl('.cas')"
                                        onfocusout="fg('.cas')">
                                    <label class="b">Upi</label><input type="text" value="0" placeholder="Upi"
                                        class="upi" onfocus="fl('.upi') " onfocusout="fg('.upi')"><br>
                                    <label class="c">Cheque</label><input type="text" placeholder="Cheque" value="0"
                                        class="che" onfocus="fl('.che')" onfocusout="fg('.che')">
                                    <label class="d">DD</label><input type="text" placeholder="DD" value="0" class="dd"
                                        onfocus="fl('.dd')" onfocusout="fg('.dd')">
                                    <br><label id="ll1"></label>
                                </div>
                            </td>
                            <td><label id="l14">Paid Amount</label>
                                <input type="text" placeholder="Paid Amount" id="t13" readonly style="height: 3rem;">
                                <label id="l15">Dues Amount</label><input type="text" placeholder="Dues Amount" id="t11"
                                    readonly><br>
                            </td>
                        </tr>
                        <tr>

                            <td id="td1"><label id="l16">Amount In Word</label><input type="text" id="t16"
                                    placeholder="Amount In Word" readonly>
                            </td>
                            <td id="td1"><label id="l17">Received From <font>*</font></label><input type="text" id="t17"
                                    placeholder="Received From" onfocus="fgchk('#t17')"
                                    onfocusout="flchk('#t17')"><br><label id="ll2"></label></td>
                        </tr>
                        <tr>
                            <td><input type="button" value="&#x2713; Submit" id="b3">
                                <input type="button" value="&#x21bb;&nbsp; Reset" id="b4" onclick="clr()">
                            </td>
                        </tr>
                    </table>
                </form>
            </div>
            <div id="ser">
                <div id="d2"><b>RECEIPT SERVICE_FORM</b></div>
                <table id="table2">
                    <tr>
                        <td><select id="s1">
                                <option value="" selected disabled>----- Select Any One -----</option>
                                <option value="recpt_no">Receipt No.</option>
                                <option value="aform_no">Admission Form No.</option>
                            </select></td>
                        <td>
                            <input type="search" id="s2" placeholder="Search Here" style="height: 4rem;width: 40rem;">
                        </td>
                        <td><label id="lt">From</label><input type="date" id="from"><label id="lt">To</label><input
                                type="date" id="to"></td>
                    </tr>
                    <tr>
                        <td id="sr" colspan="2"><i class="fa fa-search" hidden></i><input type="button"
                                value=" &nbsp; Search" id="b5"><input type="button" value="&#x21bb;&nbsp; Refresh"
                                id="b6"></td>
                    </tr>
                </table>
                <div id="d3">
                    <div id="d5">

                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="//cdn.rawgit.com/rainabba/jquery-table2excel/1.1.0/dist/jquery.table2excel.min.js"></script>
    <script>
        var recpt_no;
        var cnt = 0;
        function abc(t, l) {
            if ($(t).val() == null) {
                $(t).css({ "border": "solid 1px red", "color": "red" });
                $(l).html('*please select an option')
            }
        };
        $('#cate').on('focus', function () {
            $(this).css({ "border": "solid 1px black", "color": "black" })
            $('#s1').html('')
        });
        // =============================================================
        $('#t3').on('keypress', function (e) {

            if ((e.which == 46 || e.which == 48) && e.target.selectionStart == 0)
                return false;
            if (e.which == 46 && this.value.split('.').length == 2)
                return false;

            else if (!(e.which >= 48 && e.which <= 57 || e.which >= 65 && e.which <= 90 || e.which >= 97 && e.which <= 122)) {
                $('#ll5').html('Only Digit allowed')
                return false;
            }
            else
                $('#ll5').html('')
        });

        $('#t17').on('keypress', function (e) {
            if ((e.which == 32) && e.target.selectionStart == 0)
                return false;
            else if (!(e.which >= 65 && e.which <= 90 || e.which >= 97 && e.which <= 122 || e.which == 32)) {
                $('#ll2').html('Only Alphabate allowed')
                return false;
            }
            else
                $('#ll2').html('')
        });


        $('.cas,.upi,.che,.dd').on('keypress', function (e) {
            if ((e.which == 32) && e.target.selectionStart == 0)
                return false;
            else if (e.which == 46 && $(this).val().slice(-1) == '.') {
                $('#ll1').html('Only Digit allowed')
                return false;
            }
            else if (!(e.which >= 48 && e.which <= 57 || e.which == 46)) {
                $('#ll1').html('Only Digit allowed')
                return false;
            }
            else
                $('#ll1').html('')
        });
        // ==============================field mendatery==========================
        function flchk(id) {
            var k = $(id).val().trim();
            if (k == '') {

                $(id).removeAttr('type')
                $(id).val('Field Is Mandatory!')
                $(id).css({ "border": "solid 1px red", "color": "red" });
                flag = false
            }
        }
        function fgchk(id) {
            var k = $(id).val();
            if (k.trim() == 'Field Is Mandatory!') {
                $(id).val('')
                $(id).css({ "border": "solid 1px black", "color": "black" });
                flag = false;
            }
        }
        // ========================pay mode===============
        function fl(id) {
            var k = $(id).val().trim();
            if (k == '0') {
                $(id).removeAttr('type')
                $(id).val('')
                flag = false
            }
        }
        function fg(id) {
            var k = $(id).val();
            if (k.trim() == '') {
                $(id).val('0')
                flag = false;
            }
        }
        // ================================payment====================

        $('.cas,.upi,.che,.dd,#t9').on('input', function () {
            var a = 0 + $('.cas').val()
            var b = 0 + $('.upi').val()
            var c = 0 + $('.che').val()
            var d = 0 + $('.dd').val()
            var e = 0 + $('#t9').val()
            cd = (parseInt(a) + parseInt(b) + parseInt(c) + parseInt(d))
            $('#t13').val(cd)
            ab = parseInt(e) - parseInt(cd)
            $('#t11').val(ab)
            $('#t16').val(aab(cd))
        });

        // ====================== Animation ===============================
        $('#b2').click(function () {
            $('#togx').css({ 'margin-left': '10rem', 'border-radius': '0 1rem 1rem 0' });
            $('#body').css('margin-left', '-100%');
            $('#lf,#lt,.fa-search').show();
        })
        $('#b1').click(function () {
            $('#togx').css({ 'margin-left': '0rem', 'border-radius': '1rem 0 0 1rem' });
            $('#body').css('margin-left', '0%');
            $('#lf,#lt,.fa-search').hide();
            $('#d3').html('');
        })
        // ==============================Date=====================
        $(document).ready(function () {
            var dt = new Date()
            dd = dt.getDate()
            yy = dt.getFullYear()
            mm = dt.getMonth() + 1
            if (dd < 10)
                dd = '0' + dd
            if (mm < 10)
                mm = '0' + mm
            cd = yy + '-' + mm + '-' + dd
            $('#t10').attr('min', cd);
            $('#t2').val(cd)
            $('#t2').attr('readonly', 'readonly');

        })
        // ===================refresh====================
        function clr() {
            location.reload()
        }
        $('#b6').click(function () {
            $('#table3').html('')
            $('#s2').val('')
        })

        // ====================================submit====================
        $('#b3').click(function () {
            flag = true;
            flchk('#t3')
            flchk('#t17')
            if (flag) {
                a = confirm("Are you really want to insert record");
                if (a)
                    $.ajax({
                        url: 'money_receipt.py',
                        method: 'post',
                        data: {
                            k: 'abcd',
                            k1: $('#t1').val(),
                            k2: $('#t2').val(),
                            k3: $('#t3').val(),
                            k4: $('.cas').val(),
                            k5: $('.upi').val(),
                            k6: $('.che').val(),
                            k7: $('.dd').val(),
                            k8: $('#t11').val(),
                            k9: $('#t10').val(),
                            k10: $('#t17').val()
                        },
                        success: function (data) {
                            alert(data)
                            location.reload()
                        }
                    })
            }
            else
                alert('fill the all empty')
        })

        function auto() {
            $.ajax({
                url: "money_receipt.py",
                method: "post",
                data: {
                    x: 'auto'
                },
                success: function (data) {
                    $('#t1').val(data);
                    recpt_no = data;
                    // console.log(data)
                }
            });
        }
        // =============================search=========================
        $('#b5').click(function () {
            a = document.querySelector('#s1').value;
            b = $('#s2').val()
            $.ajax({
                url: 'money_receipt.py',
                method: 'post',
                data: {
                    k: 'search',
                    s1: a,
                    s2: b
                },
                success: function (data) {
                    if (data == 0) {
                        $('#d5').html('')
                        // console.log(data)
                        alert("Data not found")
                    }
                    else {
                        $('#d5').html(data)
                    }
                }
            })
        })
        //==================================delete============================
        $(document).on('click', '#del', function () {
            var cell = $(this).closest('tr').children("td").text().split('   ');
            alert(cell)
            tb3 = cell[0]
            alert(cell[0])
            if (table3) {
                var flag = confirm("Are you sure want to delete")
                // if (flag)
                $.ajax({
                    url: 'money_receipt.py',
                    method: 'post',
                    data: {
                        k: 'delete',
                        s1: tb3
                    },
                    success: function (data) {
                        alert(data);
                        $('this').closest('tr').remove();
                    }
                })
            }
            else
                alert('try again')

        })
        // ============================update========================
        $(document).on('click', '#upd', function () {
            var a = $(this).closest('tr').children("td").text().split('   ');
            // alert(a)
            d5 = a[0]
            if (d5) {
                var flag = confirm("Are you sure want to update")
                alert(a[0])
                if (flag)
                    $.ajax({
                        url: 'money_receipt.py',
                        method: 'post',
                        data: {
                            k: 'update',
                            s1: d5,
                            s2: a[0],
                            s3: a[1],
                            s4: a[2],
                            s5: a[3],
                            s6: a[4],
                            s7: a[5],
                            s8: a[6],
                            s9: a[7],
                            s10: a[8],
                            s11: a[9]
                        },
                        success: function (data) {
                            alert(data)
                            // alert('errf')
                        }
                    })
            }
            else
                alert('Select any row!')
        })
        $(document).on('focusout', '#e', function () {
            a = $(this).text();
            $(this).text(a + '   ')
        })
        $(document).on('focus', '#e', function () {
            a = $(this).text().trim();
            $(this).text(a)
        })

        // =================================number to word=======================
        var once = ['', 'one ', 'two ', 'three ', 'four ', 'five ', 'six ', 'seven ', 'eight ', 'nine ', 'ten ', 'eleven ', 'twelve ', 'thirteen ', 'fourteen ', 'fifteen ', 'sixteen ', 'seventeen ', 'eighteen ', 'nineteen '];
        var tense = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];

        function abc(t) {
            if (t <= 19)
                return once[t]
            else
                return tense[parseInt(t / 10)] + ' ' + once[t % 10]
        }
        function aab(t) {
            s = ''
            if (t >= 100000000000 || t == 0) return '';
            else {
                if (t >= 1000000000) {
                    s = s + abc(parseInt(t / 1000000000)) + 'arab ';
                    t = t % 1000000000;
                }
                if (t % 1000000000 >= 10000000) {
                    s = s + abc(parseInt(t / 10000000)) + 'crore ';
                    t = t % 10000000;
                }
                if (t % 10000000 >= 100000) {
                    s = s + abc(parseInt(t / 100000)) + 'lakh ';
                    t = t % 100000;
                }
                if (t % 100000 >= 1000) {
                    s = s + abc(parseInt(t / 1000)) + 'thousand ';
                    t = t % 1000;
                }
                if (t % 1000 >= 100) {
                    s = s + once[parseInt(t / 100)] + 'hundred ';
                    t = t % 100;
                }
                if (t < 100)
                    return s + abc(t)
            }
        }
    </script>
</body>

</html>
